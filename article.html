<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index,follow">
<title>समाचार | JANTA BOL</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070707;color:#f7f7f7;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;line-height:1.75}
header{padding:20px 5vw;border-bottom:1px solid #333;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.logo{font-weight:850;font-size:25px;color:white;text-decoration:none}.logo span{color:#db0b10}
.back{color:#dedede;font-size:14px}main{max-width:820px;margin:32px auto 80px;padding:0 22px}
.kicker{color:#e53a3f;font-weight:700}h1{font-size:clamp(26px,5vw,39px);line-height:1.38;margin:16px 0}
.meta{color:#bbb;font-size:14px}.lead{font-size:18px;color:#ddd;border-left:3px solid #d20b12;padding-left:15px}
.cover{display:block;max-width:100%;max-height:520px;object-fit:contain;margin:24px 0;border-radius:12px}
#body p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 1.25em;font-size:17px}
.notice{padding:18px;border:1px solid #444;border-radius:10px}
a{color:#f5b4b4}footer{border-top:1px solid #333;padding:22px;text-align:center;color:#aaa;font-size:13px}
</style>
</head>
<body>
<header><a class="logo" href="/">JANTA <span>BOL</span></a><a class="back" href="/#technology">← तकनीकी खबरें</a></header>
<main>
<div id="loading" class="notice" role="status">प्रकाशित खबर लोड हो रही है…</div>
<article id="article" hidden>
<p id="category" class="kicker"></p><h1 id="title"></h1><p id="meta" class="meta"></p>
<p id="excerpt" class="lead" hidden></p><img id="cover" class="cover" alt="" hidden>
<div id="body"></div><p id="attribution" class="meta" hidden></p>
</article>
</main><footer>JANTA BOL • सच • तथ्य • भरोसा</footer>
<script>
(async()=>{
'use strict';
const el=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const id=params.get('id');
if(!id||!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)){
  el('loading').textContent='अमान्य समाचार लिंक।';return;
}
try{
  const response=await fetch('/api/public-news?id='+encodeURIComponent(id),{cache:'no-store',credentials:'omit'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json(),a=data.article;
  if(!a){el('loading').textContent='यह खबर अभी सार्वजनिक रूप से उपलब्ध नहीं है।';return;}
  el('category').textContent=a.category||'समाचार';
  el('title').textContent=a.title||'समाचार';document.title=(a.title||'समाचार')+' | JANTA BOL';
  const d=new Date(a.published_at);
  const datePart = Number.isNaN(d.getTime()) ? '' : new Intl.DateTimeFormat('hi-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'long',year:'numeric'}).format(d);
  const timePart = Number.isNaN(d.getTime()) ? '' : new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d);
  el('meta').textContent=(datePart?'प्रकाशित: '+datePart+' • '+timePart+' IST':'प्रकाशन समय उपलब्ध नहीं')+(a.location?' • '+a.location:'');
  if(a.excerpt){el('excerpt').textContent=a.excerpt;el('excerpt').hidden=false;}
  if(a.cover_image_url&&/^https:\/\//i.test(a.cover_image_url)){el('cover').src=a.cover_image_url;el('cover').hidden=false;el('cover').referrerPolicy='no-referrer';}
  const body=typeof a.body==='string'?a.body:'';
  const pieces=body.split(/\n\s*\n/).filter(Boolean);
  if(!pieces.length){const p=document.createElement('p');p.textContent='समाचार का पूरा विवरण उपलब्ध नहीं है।';el('body').appendChild(p);}
  pieces.forEach(part=>{const p=document.createElement('p');p.textContent=part;el('body').appendChild(p);});
  if(a.public_attribution){el('attribution').textContent='स्रोत/आधार: '+a.public_attribution;el('attribution').hidden=false;}
  el('loading').hidden=true;el('article').hidden=false;
}catch(e){el('loading').textContent='खबर अभी लोड नहीं हो पा रही है। कृपया थोड़ी देर बाद फिर प्रयास करें।';}
})();
</script>
</body>
</html>
