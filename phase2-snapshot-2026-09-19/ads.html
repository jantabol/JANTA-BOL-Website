<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advertising Slots - JANTA-BOL</title><link rel="stylesheet" href="admin-common.css"></head><body><header class="topbar"><h1>JANTA-BOL Admin</h1><p>Advertising Slots</p></header><main class="page"><a class="back-link" href="admin.html">← Dashboard</a><div class="notice backend">Frontend V3 me image/video URL based ad slot state localStorage me manage hota hai. Production upload, scheduling, billing aur analytics backend phase me jayenge.</div><div class="card"><div class="field"><label class="switch-item"><input type="checkbox" id="enabled"> Homepage Ad Slot Enable</label></div><div class="field"><label for="type">Ad Type</label><select id="type"><option>Image</option><option>Video</option></select></div><div class="field"><label for="url">Media URL</label><input id="url" type="url" placeholder="https://..."></div><div class="field"><label for="target">Click Target URL</label><input id="target" type="url" placeholder="https://..."></div><div class="actions"><button class="btn primary" id="save">Save Ad Slot</button></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="backend-client.js"></script><script src="admin-auth.js"></script><script>
const KEY='jantaBolAdSettings';function readAd(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}function loadAd(){const s=readAd();enabled.checked=!!s.enabled;type.value=s.type||'Image';url.value=s.url||'';target.value=s.target||'';save.onclick=()=>{localStorage.setItem(KEY,JSON.stringify({enabled:enabled.checked,type:type.value,url:url.value.trim(),target:target.value.trim(),updatedAt:new Date().toISOString()}));alert('Ad slot frontend settings save ho gayi.')}}if(document.documentElement.dataset.jbAuth==='ready')loadAd();else addEventListener('jb-auth-ready',loadAd,{once:true});
</script></body></html>
