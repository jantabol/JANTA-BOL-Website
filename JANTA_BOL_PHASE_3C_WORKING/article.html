<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article - JANTA BOL</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c0c0c;color:#eee;font-family:Arial,sans-serif}.top{background:#090909;border-bottom:2px solid #b30000;padding:16px}.top a{color:#fff;text-decoration:none}.brand{font-size:22px;font-weight:800}.wrap{max-width:780px;margin:auto;padding:20px 14px 50px}.article{background:#151515;border:1px solid #2b2b2b;border-radius:14px;padding:20px}.kicker{color:#ff4b4b;font-weight:700}.article h1{font-size:32px;line-height:1.2}.meta{color:#aaa;line-height:1.6}.cover{width:100%;max-height:430px;object-fit:cover;border-radius:10px;margin:16px 0}.body{font-size:18px;line-height:1.8;white-space:pre-wrap}.share{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer;background:#b30000;color:#fff}.btn.secondary{background:#333}.notice{background:#2b2410;color:#ffe79a;padding:12px;border-radius:8px;line-height:1.5}.youtube{margin:18px 0}.youtube a,.additional a{color:#ff6060}.public-attribution{border-left:3px solid #b30000;padding-left:12px;color:#ccc}.additional a{display:block;word-break:break-all;margin:6px 0}@media(max-width:560px){.article h1{font-size:26px}.article{padding:16px}.body{font-size:17px}}
</style><link rel="stylesheet" href="public-ads.css?v=p4t035-review-2"></head><body><header class="top"><a href="index.html"><span class="brand">JANTA <span style="color:#e00000">BOL</span></span></a></header><main class="wrap"><div id="root"><div class="notice">Loading article…</div></div><section class="jb-ad-region"><div data-jb-ad-placement="article"></div></section><p style="text-align:center"><a style="color:#ff6060" href="grievance-submit.html">Correction / Grievance</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="backend-client.js"></script><script src="phase2-client.js"></script><script src="public-ads.js?v=p4t035-review-2"></script><script>
const root=document.getElementById('root'), params=new URLSearchParams(location.search), id=params.get('id'), adminPreview=params.get('preview')==='admin';let item=null;
function shareUrl(){const u=new URL('article.html',location.href);u.search='';u.hash='';if(item?.id)u.searchParams.set('id',item.id);return u.href}
async function shareArticle(){if(!item||adminPreview)return;JBPhase2.track(item.id,'share');const data={title:item.headline,text:item.headline,url:shareUrl()};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(data.url);alert('Article URL copy ho gaya.')}}catch(e){}}
function whatsappShare(){if(!item||adminPreview)return;location.href='https://wa.me/?text='+encodeURIComponent(item.headline+'\n'+shareUrl())}
(async()=>{try{if(adminPreview)await JBBackend.requireOwner();item=await JBBackend.getArticle(id,{privateData:false});if(item&&!adminPreview)JBPhase2.track(item.id,'view');if(!item||(!adminPreview&&item.status!=='published')){root.innerHTML='<div class="notice">Article available nahi hai ya currently unpublished hai.</div>';return}document.title=(adminPreview?'PREVIEW — ':'')+item.headline+' - JANTA BOL';const m=item.media||{},cover=JBBackend.safeUrl(m.coverImageUrl),youtube=JBBackend.safeUrl(m.youtubeUrl),additional=(m.additionalMediaUrls||[]).map(u=>({raw:u,safe:JBBackend.safeUrl(u)})).filter(x=>x.safe);const attrs=item.internalSource?.publicAttribution?`<p class="public-attribution">${JBBackend.esc(item.internalSource.publicAttribution)}</p>`:'';const shareTop=adminPreview?'<div class="notice">🔐 ADMIN PREVIEW — public sharing disabled until publish.</div>':'<div class="share"><button class="btn" onclick="shareArticle()">Share</button><button class="btn secondary" onclick="whatsappShare()">Share to WhatsApp</button></div>';const shareBottom=adminPreview?'':'<div class="share"><button class="btn" onclick="shareArticle()">Share</button><button class="btn secondary" onclick="whatsappShare()">Share to WhatsApp</button></div>';root.innerHTML=`<article class="article"><div class="notice">Permanent Article ID: <strong>${JBBackend.esc(item.id)}</strong><br>Headline/correction update hone par ye identity same rahegi.</div>${shareTop}<p class="kicker">${JBBackend.esc(item.category||'News')} • ${JBBackend.esc(item.geoLevel||'')}</p><h1>${JBBackend.esc(item.headline)}</h1><p class="meta">${JBBackend.esc(item.newsDate||'')} ${JBBackend.esc(item.newsTime||'')} • ${JBBackend.esc(item.location||'')} • ${JBBackend.esc(item.author||'JANTA BOL')}</p>${cover?`<img class="cover" src="${JBBackend.esc(cover)}" alt="Cover image">`:''}<p><strong>${JBBackend.esc(item.summary||'')}</strong></p>${attrs}<div class="body">${JBBackend.esc(item.content||'')}</div>${youtube?`<div class="youtube"><strong>YouTube:</strong> <a target="_blank" rel="noopener noreferrer" href="${JBBackend.esc(youtube)}">Video kholen</a></div>`:''}${additional.length?`<div class="additional"><h3>Additional Media</h3>${additional.map(x=>`<a target="_blank" rel="noopener noreferrer" href="${JBBackend.esc(x.safe)}">${JBBackend.esc(x.raw)}</a>`).join('')}</div>`:''}${shareBottom}</article>`;if(!adminPreview)window.JBPublicAds?.render('article',JBPublicAds.scopeForArticle(item))}catch(e){root.innerHTML='<div class="notice">'+(adminPreview?'Admin preview unavailable: ':'Article load error: ')+JBBackend.esc(e.message)+'</div>'}})();
</script></body></html>
