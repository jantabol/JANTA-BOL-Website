<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Advertising - JANTA BOL</title><link rel="stylesheet" href="admin-common.css">
<style>.card{margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.meta{font-size:12px;opacity:.8}</style></head>
<body><header class="topbar"><h1>JANTA BOL — Advertising</h1><p>Canonical campaign backend</p></header>
<main class="page"><a class="back-link" href="admin.html">← Dashboard</a>
<div class="notice backend">Vigyapan ke liye sampark — Request ≠ LIVE. Approval + confirmed payment ke bina LIVE nahi hoga. Payment/provider unavailable ho to status DUE/Pending hi rahega.</div>
<div class="card"><h2>New advertiser request</h2>
<input id="name" placeholder="Advertiser / business name"><input id="contact" placeholder="Contact">
<div class="row"><select id="placement"><option value="homepage">Homepage</option><option value="article">Article</option></select>
<select id="scope"><option value="global">Global</option><option value="local">Local</option><option value="district:shivpuri">Shivpuri District</option><option value="district:guna">Guna District</option><option value="district:ashoknagar">Ashoknagar District</option></select>
<select id="risk"><option value="normal">Normal verification</option><option value="high">Higher-risk verification</option></select>
<select id="requestKind"><option value="standard">Standard request</option><option value="custom">Custom request</option></select></div>
<button class="btn primary" id="create">Send to Admin Queue</button></div><div id="rows"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="backend-client.js"></script><script src="phase4-domain-client.js?v=20261010-b7-schedule"></script><script src="admin-auth.js"></script>
<script>'use strict';
const esc=x=>JBBackend.esc(String(x??''));
function localScheduleValue(value){if(!value)return '';const d=new Date(value);if(!Number.isFinite(d.getTime()))return '';const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());}
async function load(){try{const a=await JBPhase4.adRows();document.getElementById('rows').innerHTML=a.map(x=>`
<section class="card"><b>${esc(x.advertisers?.name||'Advertiser')}</b><div class="meta">${esc(x.id)} · ${esc(x.status)} · ${esc(x.placement)} / ${esc(x.scope)} · ${esc(x.request_kind||'standard')} · verification ${esc(x.advertisers?.verification_state||'pending')}</div>
<div class="row"><select id="s-${x.id}"><option>${esc(x.status)}</option><option>review</option><option>approved</option><option>payment_pending</option><option>live</option><option>paused</option><option>hidden</option><option>expired</option><option>rejected</option><option>cancelled</option></select><input id="n-${x.id}" placeholder="Audit note"><button class="btn primary" onclick="move('${x.id}')">Apply</button></div>
<details><summary>Creative / schedule / payment tools</summary><select id="ct-${x.id}"><option value="image">Image</option><option value="video">Video</option><option value="text">Text</option></select><input id="cm-${x.id}" placeholder="Media URL"><input id="cx-${x.id}" placeholder="Text"><select id="ca-${x.id}"><option value="">No CTA</option><option value="call">Call</option><option value="whatsapp">WhatsApp</option><option value="website">Website</option><option value="map">Map</option></select><input id="cu-${x.id}" placeholder="HTTPS URL / phone with country code"><button class="btn" onclick="creative('${x.id}')">Save and approve creative (Founder)</button>
<p class="meta">समय इस डिवाइस के टाइमज़ोन में है: ${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}</p>
<div class="row"><label>शुरू<input id="st-${x.id}" type="datetime-local" value="${localScheduleValue(x.starts_at)}"></label><label>समाप्त<input id="en-${x.id}" type="datetime-local" value="${localScheduleValue(x.ends_at)}"></label><button class="btn" onclick="scheduleAd('${x.id}')">Schedule</button></div>
<div class="row"><input id="pr-${x.id}" placeholder="Payment reference"><input id="pa-${x.id}" type="number" min="0" placeholder="Amount paise"><button class="btn" onclick="payment('${x.id}')">Record confirmed payment</button></div></details></section>`).join('')||'<div class="card">No ad requests</div>';}catch(e){document.getElementById('rows').textContent=e.message;}}
async function move(id){try{await JBPhase4.adTransition(id,document.getElementById('s-'+id).value,document.getElementById('n-'+id).value);load();}catch(e){alert(e.message);}}
async function creative(id){try{await JBPhase4.adCreative(id,{type:document.getElementById('ct-'+id).value,media:document.getElementById('cm-'+id).value,text:document.getElementById('cx-'+id).value,ctaType:document.getElementById('ca-'+id).value,ctaTarget:document.getElementById('cu-'+id).value});load();}catch(e){alert(e.message);}}
async function scheduleAd(id){try{await JBPhase4.adSchedule(id,document.getElementById('st-'+id).value,document.getElementById('en-'+id).value);load();}catch(e){alert(e.message);}}
async function payment(id){try{await JBPhase4.adConfirmPayment(id,document.getElementById('pr-'+id).value,document.getElementById('pa-'+id).value);load();}catch(e){alert(e.message);}}
document.getElementById('create').onclick=async()=>{try{const nameEl=document.getElementById('name'),contactEl=document.getElementById('contact'),placementEl=document.getElementById('placement'),scopeEl=document.getElementById('scope'),riskEl=document.getElementById('risk'),requestKindEl=document.getElementById('requestKind');const advertiserName=nameEl.value.trim(),advertiserContact=contactEl.value.trim();if(!advertiserName||!advertiserContact)throw Error('Name aur contact required');await JBPhase4.publicAdRequest({name:advertiserName,contact:advertiserContact,placement:placementEl.value,scope:scopeEl.value,risk:riskEl.value,kind:requestKindEl.value});nameEl.value='';contactEl.value='';load();}catch(e){alert(e.message);}};
if(document.documentElement.dataset.jbAuth==='ready')load();else addEventListener('jb-auth-ready',load,{once:true});
</script></body></html>
