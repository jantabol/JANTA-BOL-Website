<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporter Live — JANTA BOL</title><style>
:root{color-scheme:dark}body{font-family:Arial,sans-serif;background:#090909;color:#eee;margin:0}.top{position:sticky;top:0;background:#111;border-bottom:2px solid #b30000;padding:14px 16px;z-index:3}.wrap{max-width:680px;margin:auto;padding:14px}.card{background:#171717;border:1px solid #333;border-radius:14px;padding:16px;margin:12px 0}.btn{border:0;border-radius:9px;padding:12px 14px;background:#b30000;color:white;font-weight:700;font-size:15px}.btn.alt{background:#333}.btn:disabled{opacity:.5}label{display:block;font-weight:700;margin:12px 0 5px}input,textarea,select{width:100%;box-sizing:border-box;background:#0f0f0f;color:#fff;border:1px solid #444;border-radius:9px;padding:11px;font-size:16px}textarea{min-height:88px;resize:vertical}.muted{color:#aaa;font-size:13px}.status{padding:9px 11px;border-radius:9px;background:#111;margin-top:8px}.row{display:flex;gap:8px;flex-wrap:wrap}.request{border-top:1px solid #333;padding:13px 0}.good{color:#8be28b}.warn{color:#ffd479}.bad{color:#ff9c9c}.hidden{display:none}.locbox{display:flex;gap:8px;align-items:center}.locbox input{flex:1}.check{display:flex;gap:8px;align-items:flex-start;font-weight:400}.check input{width:auto;margin-top:3px}
</style></head><body><header class="top"><b>JANTA BOL — Reporter Live</b></header><main class="wrap"><div class="row"><button class="btn alt" id="refresh">Refresh Status</button><button class="btn alt" id="logout">Sign Out</button></div><div id="guard" class="card">Reporter access verify ho raha hai…</div><section id="app" class="hidden"><div class="card"><h2>🔴 START A LIVE REQUEST</h2><button class="btn alt" type="button" id="instantInterview">🎤 INSTANT INTERVIEW LIVE</button><div class="status muted">Interview mode technical setup nahi badalta. Headline + location confirm karke normal Admin approval flow use hoga.</div><form id="requestForm"><label>Event / Live Headline</label><input id="headline" maxlength="240" required><label>Location</label><div class="locbox"><input id="locationField" maxlength="240" required><button class="btn alt" type="button" id="locate">Use Current Location</button></div><label class="check"><input id="locationConfirmed" type="checkbox" required><span>Main submitted location ko consciously confirm karta/karti hoon.</span></label><label>Short Description</label><textarea id="description" maxlength="2000" required></textarea><label>Expected Duration</label><select id="duration"><option value="30">30 Minutes</option><option value="60">1 Hour</option><option value="120">2 Hours</option><option value="custom">Custom</option></select><div id="customWrap" class="hidden"><label>Custom Minutes (1–1440)</label><input id="customDuration" type="number" min="1" max="1440" inputmode="numeric"></div><button class="btn" id="submitRequest" type="submit">SUBMIT LIVE REQUEST</button><div id="formMsg" class="status muted">Backend confirmation ke baad hi request submitted maana jayega.</div></form></div><div class="card"><h2>My Live Requests</h2><div id="requests">Loading…</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="backend-client.js"></script><script src="phase3a-live-client.js"></script><script src="phase3c-live-delivery.js"></script><script>
const DRAFT_KEY='jbReporterLiveRequestDraft';let actionId=null;
function uuid(){return crypto.randomUUID?crypto.randomUUID():([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))}
function esc(v){return JBBackend.esc(v)}
function saveDraft(){const d={headline:headline.value,location:locationField.value,locationConfirmed:locationConfirmed.checked,description:description.value,duration:duration.value,customDuration:customDuration.value,actionId:actionId||uuid()};actionId=d.actionId;localStorage.setItem(DRAFT_KEY,JSON.stringify(d))}
function restoreDraft(){try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}');headline.value=d.headline||'';locationField.value=d.location||'';locationConfirmed.checked=!!d.locationConfirmed;description.value=d.description||'';duration.value=d.duration||'30';customDuration.value=d.customDuration||'';actionId=d.actionId||uuid()}catch(_){actionId=uuid()}toggleCustom()}
function clearDraft(){localStorage.removeItem(DRAFT_KEY);actionId=uuid();requestForm.reset();duration.value='30';toggleCustom()}
function toggleCustom(){customWrap.classList.toggle('hidden',duration.value!=='custom')}
function durationMinutes(){return duration.value==='custom'?Number(customDuration.value):Number(duration.value)}
async function boot(){try{const s=await JBBackend.session();if(!s){location.replace('reporter-login.html');return}const c=await JBLive.context();if(c.role!=='reporter'||c.reporter_active===false){guard.textContent='Reporter access denied.';return}guard.classList.add('hidden');app.classList.remove('hidden');restoreDraft();await loadRequests();try{await JBLive.subscribeNotifications(()=>loadRequests())}catch(_){}setInterval(()=>{if(document.visibilityState==='visible')loadRequests()},20000)}catch(e){guard.textContent='Reporter security check failed: '+(e.message||'Unknown error')}}
async function loadRequests(){requests.textContent='Loading…';try{const d=await JBLive.myRequests();const list=d.requests||[];requests.innerHTML=list.map(r=>{const session=r.session;let detail='';if(r.request_status==='PENDING')detail='<div class="warn">Waiting for Super Admin approval</div>';else if(r.request_status==='APPROVED'){const ss=String(session?.session_status||'PROVISIONING');const cameraReady=session&&['READY','WAITING_SIGNAL','RECONNECTING','LIVE'].includes(ss);const share=session?.article_id?`<button class="btn alt" onclick="shareLive('${esc(session.article_id)}')">SHARE LIVE LINK</button>`:'';detail='<div class="good">LIVE APPROVED — '+esc(ss==='PROVISIONING'?'Live Setup in Progress':ss)+'</div><div class="muted">JANTA BOL Live link identity taiyar hai. Public LIVE actual signal confirm hone ke baad hi dikhega.</div>'+(cameraReady?`<button class="btn" onclick="openCamera('${esc(session.id)}')">🔴 LIVE SHURU KAREIN</button>${share}<button class="btn alt" onclick="endLive('${esc(session.id)}')">END LIVE</button>`:'<div class="muted">Camera setup provider READY hone ke baad available hoga.</div>'+share);}else if(r.request_status==='REJECTED')detail='<div class="bad">Rejected'+(r.rejection_reason?' — '+esc(r.rejection_reason):'')+'</div>';else if(r.request_status==='CANCELLED')detail='<div class="muted">Cancelled</div>';const cancel=r.request_status==='PENDING'?`<button class="btn alt" onclick="cancelOne('${r.request_id}',${Number(r.state_version)})">Cancel Pending Request</button>`:'';return `<div class="request"><b>${esc(r.headline)}</b><div class="muted">${esc(r.location)} · ${Number(r.expected_duration_minutes)} min</div>${detail}${cancel}</div>`}).join('')||'<span class="muted">No Live Requests yet.</span>'}catch(e){requests.textContent=e.message||'Status unavailable'}}
async function openCamera(sessionId){try{if(window.JB3CDelivery){await JB3CDelivery.openReporterCamera(sessionId);return}const d=await JBLive.prepareCamera(sessionId);const u=d?.handoff?.handoff_url;if(!u)throw new Error('HANDOFF_NOT_READY');location.href=u}catch(e){alert(window.JB3CDelivery?JB3CDelivery.friendlyError(e.message):('Live camera open nahi hui: '+(e.message||'Unknown error')))}}
async function shareLive(articleId){try{await JB3CDelivery.shareArticle(articleId,'JANTA BOL Live');alert('JANTA BOL Live link share/copy ke liye ready hai.')}catch(e){alert('Live link abhi ready nahi hai.')}}
async function endLive(sessionId){if(!confirm('Live end request bhejna hai?'))return;try{await JBLive.endLive(sessionId);alert('Live end requested. Provider confirmation ke baad public LIVE band hoga.');await loadRequests()}catch(e){alert('Live end request failed: '+(e.message||'Unknown error'))}}
async function cancelOne(id,version){if(!confirm('Pending Live Request cancel karein?'))return;try{await JBLive.cancelRequest(id,version);await loadRequests()}catch(e){alert(e.message||'Cancel failed')}}
requestForm.addEventListener('input',saveDraft);requestForm.addEventListener('change',saveDraft);duration.onchange=()=>{toggleCustom();saveDraft()};
instantInterview.onclick=()=>{description.value='JANTA BOL Ground Interview';duration.value='30';toggleCustom();formMsg.textContent='Interview mode ready — headline aur location bhar/confirm karke request bhejein.';saveDraft();headline.focus();headline.scrollIntoView({behavior:'smooth',block:'center'})};
locate.onclick=()=>{if(!navigator.geolocation){formMsg.textContent='Device location unavailable. Location manually enter karein.';return}formMsg.textContent='Current location suggestion li ja rahi hai…';navigator.geolocation.getCurrentPosition(p=>{locationField.value=`${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`;locationConfirmed.checked=false;formMsg.textContent='Location suggested. Submit se pehle checkbox se confirm karein.';saveDraft()},()=>{formMsg.textContent='Location permission/signal unavailable. Location manually enter karein.'},{enableHighAccuracy:true,timeout:10000,maximumAge:30000})};
requestForm.onsubmit=async(e)=>{e.preventDefault();const mins=durationMinutes();if(!Number.isInteger(mins)||mins<1||mins>1440){formMsg.textContent='Valid duration enter karein.';return}if(!locationConfirmed.checked){formMsg.textContent='Location confirm karein.';return}submitRequest.disabled=true;formMsg.textContent=navigator.onLine?'Submitting…':'OFFLINE — form device par preserved hai; false success nahi dikhaya jayega.';saveDraft();try{if(!navigator.onLine)throw new Error('OFFLINE');const d=await JBLive.submitRequest({headline:headline.value,location:locationField.value,location_confirmed:true,description:description.value,expected_duration_minutes:mins,client_action_id:actionId});if(!d.request?.request_id)throw new Error('BACKEND_CONFIRMATION_MISSING');formMsg.innerHTML='<span class="good">✅ Live Request Sent — Waiting for Super Admin approval</span>';clearDraft();await loadRequests()}catch(err){formMsg.textContent=(err.message==='OFFLINE'?'OFFLINE / NOT SUBMITTED — form preserved.':('Request not confirmed: '+(err.message||'unknown error')))}finally{submitRequest.disabled=false}};
refresh.onclick=loadRequests;logout.onclick=async()=>{await JBBackend.signOut();location.replace('reporter-login.html')};
boot();
</script><script src="phase3b-reporter-ui.js"></script>
</body></html>
