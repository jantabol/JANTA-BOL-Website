<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grievance / Correction</title><style>body{font-family:Arial,sans-serif;background:#0d0d0d;color:#eee;margin:0}.top{padding:16px;background:#111;border-bottom:2px solid #b30000}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#171717;border:1px solid #333;border-radius:12px;padding:16px;margin:12px 0}.btn{background:#b30000;color:white;border:0;border-radius:8px;padding:10px 14px;font-weight:700}.btn.alt{background:#333}input,textarea,select{width:100%;padding:10px;margin:6px 0 12px;background:#111;color:#fff;border:1px solid #444;border-radius:7px;box-sizing:border-box}.muted{color:#aaa}.row{display:flex;gap:8px;flex-wrap:wrap}.back{color:#fff}</style></head><body><header class="top"><b>JANTA BOL — Grievance / Correction</b></header><main class="wrap"><div class="card"><h2>Grievance / Correction Request</h2><input id="name" placeholder="Name"><input id="contact" placeholder="Contact"><input id="articleId" placeholder="Article ID (optional)"><input id="articleUrl" placeholder="Article URL"><textarea id="issue" placeholder="What is wrong?"></textarea><textarea id="reason" placeholder="Reason / details"></textarea><textarea id="evidence" placeholder="Evidence note"></textarea><label><input id="urgent" type="checkbox" style="width:auto"> Urgent</label><br><button class="btn" id="send">Submit</button><p id="msg"></p></div><script>const formName=document.getElementById('name'),formContact=document.getElementById('contact'),formArticleId=document.getElementById('articleId'),formArticleUrl=document.getElementById('articleUrl'),formIssue=document.getElementById('issue'),formReason=document.getElementById('reason'),formEvidence=document.getElementById('evidence'),formUrgent=document.getElementById('urgent'),formSend=document.getElementById('send'),formMsg=document.getElementById('msg');formSend.onclick=async()=>{try{if(!formName.value.trim()||!formContact.value.trim()||!formIssue.value.trim())throw new Error('Name, contact aur issue required hain.');const g=await JBPhase2.createGrievance({name:formName.value,contact:formContact.value,articleId:formArticleId.value||null,articleUrl:formArticleUrl.value,issue:formIssue.value,reason:formReason.value,evidence:formEvidence.value,urgent:formUrgent.checked});formMsg.textContent='Received. Grievance ID: '+g.id}catch(e){formMsg.textContent=e.message}}</script></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="backend-client.js"></script><script src="phase2-client.js"></script></body></html>
