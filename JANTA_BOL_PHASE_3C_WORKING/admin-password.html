<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>JANTA-BOL Founder Password</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f4f6f8;
      color:#222;
    }

    header{
      background:#c90000;
      color:#fff;
      text-align:center;
      padding:24px 16px;
    }

    header h1{
      margin:0;
      font-size:28px;
    }

    header p{
      margin:6px 0 0;
      font-size:18px;
    }

    main{
      padding:24px 16px;
    }

    .card{
      max-width:600px;
      margin:auto;
      background:#fff;
      border-radius:16px;
      padding:24px;
      box-shadow:0 3px 15px rgba(0,0,0,.08);
    }

    h2{
      margin-top:0;
    }

    .info{
      background:#eef4ff;
      padding:14px;
      border-radius:10px;
      line-height:1.5;
      margin-bottom:20px;
    }

    label{
      display:block;
      font-weight:bold;
      margin:16px 0 7px;
    }

    input{
      width:100%;
      padding:14px;
      border:1px solid #bbb;
      border-radius:10px;
      font-size:18px;
    }

    button{
      margin-top:20px;
      background:#c90000;
      color:#fff;
      border:0;
      border-radius:10px;
      padding:14px 18px;
      font-size:16px;
      font-weight:bold;
    }

    #msg{
      display:none;
      margin-bottom:18px;
      padding:14px;
      border-radius:10px;
      background:#fff5cc;
      line-height:1.4;
    }

    #formArea{
      display:none;
    }
  </style>
</head>

<body>

<header>
  <h1>JANTA-BOL</h1>
  <p>Founder Password Change</p>
</header>

<main>
  <div class="card">

    <h2>🔐 Change Founder Password</h2>

    <div class="info">
      Sirf verified Founder + AAL2 session me password change hoga.
      Password kisi chat ya screenshot me share na karein.
    </div>

    <div id="msg"></div>
   <div id="mfaArea" style="display:none;">

  <label for="totpCode">
    Authenticator 6-Digit Code
  </label>

  <input
    id="totpCode"
    type="text"
    inputmode="numeric"
    maxlength="6"
    autocomplete="one-time-code"
    placeholder="6-digit code"
  >

  <button id="verifyMfaBtn">
    Verify 2FA
  </button>

</div>
    <div id="formArea">

      <label for="newPassword">
        New Password
      </label>

      <input
        id="newPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Enter new password"
      >

      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Same password again"
      >

      <button id="changeBtn">
        Change Founder Password
      </button>

    </div>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="backend-client.js"></script>

<script>
'use strict';

const msg=document.getElementById('msg');
const mfaArea=document.getElementById('mfaArea');
const totpCode=document.getElementById('totpCode');
const verifyMfaBtn=document.getElementById('verifyMfaBtn');
const formArea=document.getElementById('formArea');
const newPassword=document.getElementById('newPassword');
const confirmPassword=document.getElementById('confirmPassword');
const changeBtn=document.getElementById('changeBtn');
let freshMfaVerified=false;
function showMessage(text){
  msg.style.display='block';
  msg.textContent=text;
}

async function boot(){
  try{
    const s=await JBBackend.session();

    if(!s){
      throw new Error('Founder login required.');
    }

    const r=await JBBackend.role();

    if(r!=='owner'){
      throw new Error('Founder/Super Admin account required.');
    }

    const aal=await JBBackend.mfaAAL();

    if(aal?.currentLevel!=='aal2' || !freshMfaVerified){
  mfaArea.style.display='block';
  formArea.style.display='none';

  showMessage(
    'Founder session verified — 2FA code enter karein.'
  );

  return;
}

mfaArea.style.display='none';

    formArea.style.display='block';
    showMessage(
      'Verified Founder AAL2 session — password change allowed.'
    );

  }catch(error){
    showMessage(error.message||String(error));
  }
}
 verifyMfaBtn.addEventListener('click',async()=>{
  try{
    const code=totpCode.value.trim();

    if(!/^\d{6}$/.test(code)){
      throw new Error('Valid 6-digit Authenticator code enter karein.');
    }

    const factors=await JBBackend.mfaListFactors();

    const factor=(factors?.totp||[])
      .find(f=>f.status==='verified');

    if(!factor){
      throw new Error('Verified TOTP factor nahi mila.');
    }

    verifyMfaBtn.disabled=true;

    await JBBackend.mfaChallengeAndVerify(
      factor.id,
      code
    );

    totpCode.value='';
  freshMfaVerified=true;
    await boot();

  }catch(error){
    showMessage(
      error.message||String(error)
    );

  }finally{
    verifyMfaBtn.disabled=false;
  }
});
changeBtn.addEventListener('click',async()=>{
  try{
    const p1=newPassword.value;
    const p2=confirmPassword.value;

    if(!p1 || !p2){
      throw new Error('Dono password fields bharein.');
    }

    if(p1!==p2){
      throw new Error('Passwords match nahi kar rahe.');
    }

    

    changeBtn.disabled=true;

    await JBBackend.changePassword(p1);

    newPassword.value='';
confirmPassword.value='';

freshMfaVerified=false;
formArea.style.display='none';
mfaArea.style.display='block';

showMessage(
  'Founder password successfully changed. Next change ke liye fresh 2FA code required.'
);

  }catch(error){
    showMessage(error.message||String(error));

  }finally{
    changeBtn.disabled=false;
  }
});

boot();
</script>

</body>
</html>
