<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Published News - JANTA-BOL Admin</title><link rel="stylesheet" href="admin-common.css"></head><body>
<header class="topbar"><h1>JANTA-BOL Admin</h1><p>Published News</p></header><main class="page"><a href="admin.html" class="back-btn">← Admin Dashboard</a><div class="notice backend">Real Supabase published records. Edit/Correction aur Unpublish me same Article ID preserve rahega.</div><div id="publishedList"><div class="empty">Loading…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="backend-client.js"></script><script src="admin-auth.js"></script><script>
const root=document.getElementById('publishedList');
async function render(){try{const news=await JBBackend.listPublished();if(!news.length){root.innerHTML='<div class="empty">Abhi koi published news nahi hai.</div>';return}root.innerHTML=news.map(n=>`<article class="news-card"><div>${n.breaking?'<span class="badge">Breaking</span>':''}${n.topStory?'<span class="badge">Top Story</span>':''}</div><h2>${JBBackend.esc(n.headline)}</h2><p>${JBBackend.esc(n.summary||'')}</p><p class="muted"><strong>ID:</strong> ${JBBackend.esc(n.id)}<br><strong>Version:</strong> ${n.version} • <strong>Published:</strong> ${JBBackend.esc(n.publishedAt||'-')}</p><div class="buttons"><button class="action secondary" onclick="previewItem('${n.id}')">Article Preview</button><button class="action warning" onclick="editItem('${n.id}')">Edit / Correction</button><button class="action primary" onclick="unpublishItem('${n.id}',${n.version})">Unpublish → Draft</button><button class="action danger" onclick="trashItem('${n.id}',${n.version})">Delete → Trash</button></div></article>`).join('')}catch(e){root.innerHTML='<div class="notice">'+JBBackend.esc(e.message)+'</div>'}}
function previewItem(id){location.href='article.html?id='+encodeURIComponent(id)}
function editItem(id){location.href='add-news.html?edit='+encodeURIComponent(id)+'&from=published'}
async function unpublishItem(id,v){if(!confirm('Is news ko Unpublish karke Draft me bhejna hai?'))return;try{await JBBackend.unpublish(id,v);alert('Unpublished. Same Article ID preserve hai.');await render()}catch(e){alert(e.message==='VERSION_CONFLICT'?'Naya version mil gaya. Refresh karein.':e.message)}}
async function trashItem(id,v){if(!confirm('Published news ko Trash me bhejna hai?'))return;try{await JBBackend.softDelete(id,v);await render()}catch(e){alert(e.message==='VERSION_CONFLICT'?'Naya version mil gaya. Refresh karein.':e.message)}}
addEventListener('jb-auth-ready',render,{once:true});
</script></body></html>
