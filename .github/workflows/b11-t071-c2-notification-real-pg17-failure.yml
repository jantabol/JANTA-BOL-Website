name: B11 T071 C2 real notification store failure - PG17 only, no Vercel
on:
  push:
    branches: [codex/b11-t071-failure-isolation-preflight-20261027]
    paths:
      - 'ci/phase4/b11/t071-c2-notification-storage-real-pg17.sql'
      - '.github/workflows/b11-t071-c2-notification-real-pg17-failure.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ci/phase4/b11/t071-c2-notification-storage-real-pg17.sql'
      - '.github/workflows/b11-t071-c2-notification-real-pg17-failure.yml'
permissions:
  contents: read
jobs:
  real_b8_pg17_notification_fail_core_news_independent:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && ((github.event_name == 'push' && github.ref == 'refs/heads/codex/b11-t071-failure-isolation-preflight-20261027') || (github.event_name == 'pull_request' && github.head_ref == 'codex/b11-t071-failure-isolation-preflight-20261027')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: T071_C2_DISPOSABLE_PASSWORD_ONLY
          POSTGRES_USER: postgres
          POSTGRES_DB: jb_t071_c2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jb_t071_c2"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: T071_C2_DISPOSABLE_PASSWORD_ONLY
      PGDATABASE: jb_t071_c2
    steps:
      - name: Checkout T071 review-only fault script, no token persisted
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout pinned authentic B8 G1-G4 SQL as separate source fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 658f474d6ee0f24efac60f069979e8adee1e9221
          path: t071-c2-real-b8
          persist-credentials: false
      - name: Ensure exact repo, source SHA, DB and no live secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'jantabol/JANTA-BOL-Website'
          test "$(git -C t071-c2-real-b8 rev-parse HEAD)" = '658f474d6ee0f24efac60f069979e8adee1e9221'
          test "$PGDATABASE" = 'jb_t071_c2'
          test "$PGHOST" = '127.0.0.1'
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          test "$(psql -X -Atqc 'show server_version_num' | cut -c 1-2)" = 17
          echo 'C2_ACTUAL_POSTGRESQL17_LOCAL_ONLY=VERIFIED'
      - name: Materialize 15 exact source migrations on disposable PostgreSQL only
        shell: bash
        run: |
          set -Eeuo pipefail
          d=t071-c2-real-b8
          n=0
          apply() { psql -X -v ON_ERROR_STOP=1 -q -f "$d/$1" >/dev/null; n=$((n+1)); }
          apply ci/phase4/b8-g1-disposable-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_case_reporter_scope_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_owner_mobile_case_picker_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_cp02_editor_immutable_review_REVIEW_ONLY.sql
          apply ci/phase4/b8-g2-cp01-cascade-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp01_provenance_survival_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp02_article_hold_GUARD_REVIEW_ONLY.sql
          apply ci/phase4/b8-g2-cp03-upload-session-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp03_private_upload_REVIEW_ONLY.sql
          apply ci/phase4/b8-g3-cp02-notification-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g3_cp02_founder_proof_notifications_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g3_cp03_manual_handoff_truth_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g3_cp04_reply_claim_REVIEW_ONLY.sql
          apply ci/phase4/b8-g4-public-article-status-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g4_cp01_cp03_public_projection_REVIEW_ONLY.sql
          test "$n" -eq 15
          echo 'C2_AUTHENTIC_B8_G1_TO_G4_APPLIED_LOCAL_ONLY=15'
      - name: Inject genuine notification Postgres write failure and commit real B8 case
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -f ci/phase4/b11/t071-c2-notification-storage-real-pg17.sql
          echo 'C2_REAL_NOTIFICATION_STORAGE_NEGATIVE_PROBE=EXECUTED'
          echo 'C2_EXTERNAL_PROVIDER_MESSAGING_E2E=NOT_RUN'
          echo 'C2_FULL_13_DOMAIN_INTEGRATED_E8=HOLD'
          echo 'C1_PREVIEW_HOSTED=HOLD'
          echo 'T071_FINAL_PASS_LOCK=false'
