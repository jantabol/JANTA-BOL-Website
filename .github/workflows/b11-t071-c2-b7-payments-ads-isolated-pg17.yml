name: B11 T071 C2 real B7 payment outage and Ads guard (disposable only)
on:
  push:
    branches: [codex/b11-t071-failure-isolation-preflight-20261027]
    paths:
      - 'ci/phase4/b11/t071-c2-b7-real-pg17-payment-ads-fault.sql'
      - '.github/workflows/b11-t071-c2-b7-payments-ads-isolated-pg17.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ci/phase4/b11/t071-c2-b7-real-pg17-payment-ads-fault.sql'
      - '.github/workflows/b11-t071-c2-b7-payments-ads-isolated-pg17.yml'
permissions:
  contents: read
jobs:
  b7_payment_storage_real_pg17_outage:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && ((github.event_name == 'push' && github.ref == 'refs/heads/codex/b11-t071-failure-isolation-preflight-20261027') || (github.event_name == 'pull_request' && github.head_ref == 'codex/b11-t071-failure-isolation-preflight-20261027')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: T071_C2_ADS_DISPOSABLE_ONLY
          POSTGRES_USER: postgres
          POSTGRES_DB: jb_t071_c2_ads
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jb_t071_c2_ads"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 25
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: T071_C2_ADS_DISPOSABLE_ONLY
      PGDATABASE: jb_t071_c2_ads
    steps:
      - name: T071 PR only (no credentials persisted)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin actual original B7 payment and Ads source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 658f474d6ee0f24efac60f069979e8adee1e9221
          path: t071-c2-b7-real-source
          persist-credentials: false
      - name: Refuse real production credentials, database, other repository
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'jantabol/JANTA-BOL-Website'
          test "$(git -C t071-c2-b7-real-source rev-parse HEAD)" = '658f474d6ee0f24efac60f069979e8adee1e9221'
          test "$PGDATABASE" = 'jb_t071_c2_ads'
          test "$PGHOST" = '127.0.0.1'
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num' | cut -c1-2)" = 17
          echo 'T071_C2_B7_REAL_PG17_LOCAL_ONLY=PASS'
      - name: Apply actual project-authored B7 payment fixture + original candidate guards to isolated PG17
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -f t071-c2-b7-real-source/ci/phase4/b7-payment-fixture.sql
          psql -X -q -v ON_ERROR_STOP=1 -f t071-c2-b7-real-source/JANTA_BOL_PHASE_4_WORKING/db/20261010_b7_manual_payment_REVIEW_ONLY.sql
          psql -X -q -v ON_ERROR_STOP=1 -f t071-c2-b7-real-source/JANTA_BOL_PHASE_4_WORKING/db/20261012_b7_lifecycle_state_guard_REVIEW_ONLY.sql
          echo 'T071_C2_ORIGINAL_B7_SOURCE_MIGRATIONS_APPLIED_EPHEMERAL=PASS'
      - name: Inject genuine storage outage and verify unpaid campaign cannot become LIVE
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -f ci/phase4/b11/t071-c2-b7-real-pg17-payment-ads-fault.sql
          echo 'T071_C2_PAID_AD_B7_SQL_FAULT=PASS_SCOPED'
          echo 'T071_C2_REAL_BANK_PAYMENT_OR_PRODUCTION=NOT_TESTED'
          echo 'T071_FULL_INTEGRATED_13_MODULES=HOLD'
          echo 'T071_C1=HOLD_VERCEL_PREVIEW'
          echo 'T071_FINAL_PASS_LOCK=false'
