# P4-T088 RUN15 (sections 784-792). Source E1, real public HTTPS E6-slice.
# E3 real Android + E6 auth/provider + E8 real backup restore are NOT supplied by CI.
name: B13 T088 Production Backup Recovery Android Readiness — Protected Preflight
on:
  push:
    branches: [codex/b13-t088-prod-backup-recovery-preflight-20261102]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jb-b13-t088-production-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_t088_source_and_locked_baseline:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' }}
    name: Original T088 RUN15 E1, B11 E8, Phase3/B12 and T087 preserved
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: No changes to product / originals / DB / backup workflows, no production secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=48260e31e8e69dc12d6905c5765b0341f3538192
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          while IFS= read -r path; do
            case "$path" in
              'JANTA_BOL_PHASE_4_WORKING/review/P4_T088_PRODUCTION_RECOVERY_READINESS_START_20261102.md'|'JANTA_BOL_PHASE_4_WORKING/TEST-REGISTER.md'|'ci/phase4/b13-t088-prod-backup-recovery-readiness-preflight.test.mjs'|'ci/phase4/b13-t088-prod-anon-rpc-readonly.mjs'|'ci/phase4/b13-t088-prod-edge-jwt-negative-readonly.mjs'|'ci/phase4/b13-t088-local-full-recovery-synthetic.sh'|'ci/phase4/b13-t088-local-full-recovery-synthetic.mjs'|'ci/phase4/b13-t088-vercel-public-source-reconstruction.mjs'|'ci/phase4/b13-t088-edge-source-lineage-contract.test.mjs'|'JANTA_BOL_PHASE_4_WORKING/review/P4_T088_EDGE_SOURCE_LINEAGE_MANIFEST_20261102.json'|'.github/workflows/b13-t088-prod-backup-readiness-preflight-20261102.yml') ;;
              *) echo "T088_RED_UNAUTHORIZED_PRODUCT_BACKUP_OR_OLD_TEST_CHANGE=$path"; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          echo 'T088_ORIGINAL_PRODUCTION_AND_BACKUP_CODE_IMMUTABLE=PASS'
      - name: Original T088 784-792 four evidence classes contract and integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test ci/phase4/b13-t088-prod-backup-recovery-readiness-preflight.test.mjs
          node --test ci/phase4/b13-t088-edge-source-lineage-contract.test.mjs
      - name: Re-run unchanged Phase3 security + backup/recovery + incident originals
        shell: bash
        run: |
          set -Eeuo pipefail
          node ci/phase3-regression/static-p3-security-regression.cjs
          node ci/phase3-regression/static-p3-recovery-regression.cjs
          node ci/phase3-regression/static-p3-incident-regression.cjs
          node ci/phase3-regression/static-p3-preprod-regression.cjs
      - name: B11 T070 real restore gate (isolated source only) and T071 failure matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test ci/phase4/b11/t070-final-e8-gate.test.mjs
          node --test ci/phase4/b11/t070-real-joint-manual-safety.test.mjs
          node --test ci/phase4/b11/t071-c2-all-13-scoped-fault-proof-contract.test.mjs
          node --test ci/phase4/b11/t071-c1-published-android-no-stuck-loading.test.mjs
      - name: B12 original Android news + Admin Auth + published Truth + B13 old Core/Security source
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test ci/phase4/b12/founder-auth-readonly-regression.test.cjs
          node --test ci/phase4/b12/t080-android-reload-reconciliation.test.mjs
          node --test ci/phase4/b12/t080-admin-ack-failclosed.test.mjs
          node --test ci/phase4/b12/t083-current-live-public-truth-safety.test.mjs
          node --test ci/phase4/b13-t086-run15-lifecycle-full.test.mjs
          node --test ci/phase4/b13-t087-cross-module-security-negative-map.test.mjs
      - name: Honest E1-only conclusion
        run: |
          echo 'T088_SOURCE_AND_OLD_CI_E1=PASS_SCOPED_IF_ALL_GREEN'
          echo 'T088_REAL_PHONE_TABLET_E3=NOT_TESTED_BY_THIS_JOB'
          echo 'T088_REAL_PROVIDER_API_E6=NOT_TESTED_BY_THIS_JOB'
          echo 'T088_REAL_JOINT_DB_MEDIA_RESTORE_E8=NOT_TESTED_BY_THIS_JOB'
          echo 'T087_ORIGINAL_SIGNED_HOSTED_E2_AND_COMPLETE_E5=DUE'
          echo 'T088_FINAL_PASS_LOCK=HOLD'
  current_public_https_readonly_smoke:
    name: Current public jantabol.in real HTTPS GET, no login/API/DB writes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET current real public HTTPS domain with verified TLS, no secrets or writes
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          home="$RUNNER_TEMP/t088_public_home.html"
          meta="$(curl --silent --show-error --location --retry 2 --retry-delay 1 \
            --connect-timeout 12 --max-time 35 --proto '=https' --tlsv1.2 \
            --output "$home" --write-out '%{http_code} %{url_effective} %{ssl_verify_result}' \
            'https://jantabol.in/')"
          read -r code url tlsverify <<< "$meta"
          test "$code" = 200 || { echo "T088_PRODUCTION_HTTPS_UNEXPECTED_STATUS=$code"; exit 1; }
          test "$tlsverify" = 0 || { echo "T088_PRODUCTION_TLS_VERIFY_FAILED"; exit 1; }
          case "$url" in https://jantabol.in/*) ;; *) echo "T088_UNEXPECTED_FINAL_ORIGIN=$url"; exit 1;; esac
          grep -Eiq 'JANTA.BOL|जनता बोल|JANTA-BOL' "$home" || { echo 'T088_PUBLIC_BRAND_NOT_FOUND'; exit 1; }
          test "$(wc -c < "$home")" -gt 500 || { echo 'T088_PUBLIC_HOME_TOO_SMALL'; exit 1; }
          echo "T088_REAL_PUBLIC_DOMAIN_HTTPS_TLS_GET=PASS_SCOPED"
          echo "T088_REAL_AUTH_API_DB_PROVIDER_OR_RESTORE=NOT_PROVEN_BY_PUBLIC_GET"
  protected_phase3_news_auth_existing:
    uses: ./.github/workflows/b12-b8-reconciled-protected.yml
    permissions:
      contents: read

  current_real_anonymous_published_news_rpc:
    name: Real production anon C1 RPC GET; published-only, no private auth or writes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Canonical anonymous-only production API read; publishable public key, no service-role secret
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          node ci/phase4/b13-t088-prod-anon-rpc-readonly.mjs

  actual_hosted_edge_no_jwt_denials:
    name: Hosted Edge JWT required negative (no credentials, GET only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Existing verify_jwt Edge endpoints refuse unauthenticated GET
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          node ci/phase4/b13-t088-prod-edge-jwt-negative-readonly.mjs

  t088_local_synthetic_go_true_storage_edge:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' }}
    name: No-cost isolated GoTrue+signed RLS+private Storage (Edge 503 explicitly HOLD)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Static safety checks and failure-closed scope, no protected credential
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/b13-t088-prod-backup-recovery-preflight-20261102'
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          bash -n ci/phase4/b13-t088-local-full-recovery-synthetic.sh
          node --check ci/phase4/b13-t088-local-full-recovery-synthetic.mjs
          echo 'T088_LOCAL_ONLY_NO_PROD_KEYS_OR_B2=PASS'
      - name: Install pinned local Supabase CLI, never deploy
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.120.0
      - name: Boot local GoTrue+Storage+PostgREST with 2 FAKE signed users; keep Edge 503 HOLD
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ci/phase4/b13-t088-local-full-recovery-synthetic.sh
          echo 'T088_SYNTHETIC_GO_TRUE_POSTGREST_STORAGE=PASS_SCOPED'
          echo 'T088_SYNTHETIC_EDGE_LOCAL_BOOT_503=HOLD_NOT_RETRIED'
          echo 'T088_ORIGINAL_FULL_PLATFORM_E8=HOLD'

  t088_offline_deployed_static_site_restore:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' }}
    name: Exact deployed SHA static site restore vs live HTTPS bytes (no Vercel deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Reconstruct local site from deployed SHA; compare bytes and security headers
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${VERCEL_TOKEN:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          node ci/phase4/b13-t088-vercel-public-source-reconstruction.mjs
          echo 'T088_REAL_VERCEL_DEPLOYMENT_PROMOTED=NO'
          echo 'T088_PROD_AUTH_EDGE_VERCEL_FULL_RESTORE=NOT_RUN'
