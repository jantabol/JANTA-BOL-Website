name: B11 Whole Backup Recovery Development (Never LIVE)
on:
  push:
    branches: [codex/b11-backup-recovery-g0-preflight-20261024]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  immutable_previous_b0_b8:
    name: B0-B8 immutable regression protected PG17 existing suite
    uses: ./.github/workflows/b8-g0-g1-disposable-pg17-and-protected-static.yml

  original_g0:
    name: B11 pre-code locked original 109/7 test source gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Original seven B11 tests and safe release gate
        run: node --test ci/phase4/b11-g0-readonly-source-and-release-gates.test.mjs
      - name: Existing B10 original tests source contract retained
        run: node --test ci/phase4/b10-whole-platform-security-source.test.mjs
      - name: Preserve B9 existing functional UI regressions
        run: node --test ci/phase4/b9-client-and-ui.test.mjs
      - name: Original backup diagnostics without changing older files
        run: python3 -m unittest discover -s ci/backup -p 'test_*.py'
      - name: Guard API credentials absent from candidate workflow
        run: |
          set -euo pipefail
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"

  b11_development:
    name: B11 T069-T075 offline backup recovery functionality and security/failure suite
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: One-shot T069-T075 deterministic offline recovery test suite
        run: node --test ci/phase4/b11/recovery-engine.test.mjs
      - name: Verify detached signer, tampering, wrong-key and old T034 restore bridge safeguards
        run: |
          node --test ci/phase4/b11/signed-evidence.test.mjs
          node --test ci/phase4/b11/restore-bridge.test.mjs
          bash -n ci/phase4/b11/t034-networkless-restore-bridge.sh
      - name: B11 encrypt a real AGE dual-recipient synthetic media+signed identity bundle, decrypt/compare bytes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y age zstd > /dev/null
          node --test ci/phase4/b11/media-offsite-companion.test.mjs
          bash -n ci/phase4/b11/media-offsite-companion.sh
          d="$(mktemp -d)"
          trap 'rm -rf -- "$d"' EXIT
          node ci/phase4/b11/cli.mjs fixture --path "$d/fake_source" >/dev/null
          node - "$d" <<'NODE'
          const {generateKeyPairSync}=require('node:crypto');
          const {writeFileSync}=require('node:fs');
          const x=generateKeyPairSync('ed25519');
          writeFileSync(process.argv[2]+'/founder-private.pem',x.privateKey.export({type:'pkcs8',format:'pem'}),{mode:0o600});
          writeFileSync(process.argv[2]+'/founder-public.pem',x.publicKey.export({type:'spki',format:'pem'}));
          NODE
          node ci/phase4/b11/cli.mjs sign-offline --path "$d/fake_source" --private-key "$d/founder-private.pem" --signature "$d/signature.json" --confirm JANTA_BOL_OFFLINE_SIGN_ONLY >/dev/null
          age-keygen -o "$d/age-founder" >/dev/null 2>&1
          export JB_BACKUP_AGE_RECIPIENT="$(age-keygen -y "$d/age-founder")"
          bash ci/phase4/b11/media-offsite-companion.sh synthetic-local "$d/fake_source" "$d/signature.json" "$d/founder-public.pem" > "$d/media-proof.txt"
          grep -Fxq 'B11_MEDIA_ENCRYPTED_OFFSITE_ROUNDTRIP=PASS' "$d/media-proof.txt"
          grep -Fxq 'B11_MEDIA_EVIDENCE_KIND=SYNTHETIC_LOCAL_NOT_REAL_B2' "$d/media-proof.txt"
      - name: T069 current backend health vs historical B2 and missing real original-proof fail-closed
        run: |
          node --test ci/phase4/b11/t069-backup-health-evidence.test.mjs
          node ci/phase4/b11/t069-backup-health-evidence.mjs > /tmp/b11-t069-asof-readonly.json
          node -e "const a=require('/tmp/b11-t069-asof-readonly.json'); if(a.final_t069!=='HOLD'||a.development_backend_precheck!=='PASS'||a.production_backup_dispatched)process.exit(1)"
      - name: "T074 direct private Storage object 3-bucket byte export plus double-list drift/404 deny synthetic API"
        run: node --test ci/phase4/b11/storage-readonly-export.test.mjs
      - name: End-to-end command interface on disposable fake backup/media bytes
        shell: bash
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          trap 'rm -rf -- "$d"' EXIT
          node ci/phase4/b11/cli.mjs fixture --path "$d/source" > /dev/null
          node ci/phase4/b11/cli.mjs verify --path "$d/source" >/dev/null
          node ci/phase4/b11/cli.mjs copy-disposable --source "$d/source" --dest "$d/restored" --confirm JANTA_BOL_DISPOSABLE_ONLY > "$d/disposable-restore-result.json"
          node -e "const f=require(process.argv[1]);if(f.state!=='VERIFIED_DISPOSABLE_COPY'||f.db_sql_restore_executed)process.exit(1)" "$d/disposable-restore-result.json"
          node ci/phase4/b11/cli.mjs verify --path "$d/restored" > /dev/null
          node ci/phase4/b11/cli.mjs incident --type lost_founder_device > "$d/incident.json"
          node -e "const a=require(process.argv[1]);if(a.decision!=='HOLD_FOR_SAFE_EVIDENCE'||a.automatic_destructive_action)process.exit(1)" "$d/incident.json"
          echo 'B11_OFFLINE_DISPOSABLE_MEDIA_HASH_AND_IDENTITY=PASS; LIVE_DB_NOT_TOUCHED=true'
      - name: Prevent unsafe B11 automation and production restore scripts
        run: |
          set -euo pipefail
          ! grep -Eq '^[[:space:]]*(schedule|push):' .github/workflows/b7-production-free-encrypted-backup-MANUAL.yml
          test ! -e ci/phase4/b11/.env
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          echo 'B11_DEV_ONLY_NOT_PRODUCTION_RESTORE_OR_FINAL_PASS_LOCK'

  b11_candidate_gate:
    name: B11 coding complete development gate (official T069-T075 still require real proofs)
    needs: [immutable_previous_b0_b8, original_g0, b11_development]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve honest evidence status
        run: |
          echo 'B11 source functional/safety candidate PASS.'
          echo 'Original T069–T075 real backup/media/fully deployed recovery tests NOT RUN.'
          echo 'Historic B7-T034 actual PG17 DB-only restore re-used; storage bytes/config still UNPROVEN.'
          echo 'Original B10 final HOLD is never waived by this workflow.'

  b11_source_package:
    name: B0-B11 exact source ZIP and SHA256 per-file integrity development artifact
    needs: [b11_candidate_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build and independently re-read every B0-B11 tracked source file SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/phase4/b11/build_b0_b11_development_source_zip.py --out dist/JANTA_BOL_B0_B11_DEVELOPMENT_CANDIDATE.zip
          python3 ci/phase4/b11/build_b0_b11_development_source_zip.py --verify dist/JANTA_BOL_B0_B11_DEVELOPMENT_CANDIDATE.zip
          test -s dist/MASTER_ZIP_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JANTA_BOL_B0_B11_DEVELOPMENT_CANDIDATE
          path: |
            dist/JANTA_BOL_B0_B11_DEVELOPMENT_CANDIDATE.zip
            dist/MASTER_ZIP_SHA256.txt
          retention-days: 30
          if-no-files-found: error
