# T081: diagnostic only. Never dispatch original encrypted backup/restore
# and NEVER mutate production DNS/DB/B2/Founder auth from this workflow.
name: T081 Production Release & Recovery Fail-Closed Review (NO LIVE WRITES)
on:
  push:
    branches: [codex/t081-readonly-release-recovery-20261031]
    paths:
      - '.github/workflows/b12-t081-review-gate.yml'
      - 'ci/phase4/b12/t081-release-recovery-no-write.test.mjs'
      - 'JANTA_BOL_PHASE_4_WORKING/b12/P4_T081_CURRENT_RELEASE_PREFLIGHT_20261031.md'
  pull_request:
    branches: [codex/t080-admin-ack-failclosed-review-20261031]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janta-bol-t081-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-no-live-write:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && (github.ref == 'refs/heads/codex/t081-readonly-release-recovery-20261031' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact review-only scope + never fetch production secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'jantabol/JANTA-BOL-Website'
          test "$GITHUB_REF" = 'refs/heads/codex/t081-readonly-release-recovery-20261031' || test "$GITHUB_EVENT_NAME" = 'pull_request'
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${CRICKET_DATABASE_URL:-}"
          node --check ci/phase4/b12/t081-rollout-rollback-guard.cjs
      - name: Real source T081 production guard negative matrix
        run: node --test ci/phase4/b12/t081-release-recovery-no-write.test.mjs
      - name: Original T070 recovery and T075 zero-paid budget regression
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test ci/phase4/b11/t070-real-joint-manual-safety.test.mjs
          node --test ci/phase4/b11/t070-joint-storage-snapshot-identity.test.mjs
          node --test ci/phase4/b11/t075-scheduled-budget.test.mjs
      - name: Original T075 source-integration gate (RED until candidate is reconciled)
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test ci/phase4/b11/t075-scheduled-backup-auth.test.mjs
      - name: Exact zero-product-change guard against current production source
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='93df12aa8ffdfae38d9a4066b6a4556bb36969e5'
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
            case "$path" in
              .github/workflows/b12-t081-review-gate.yml|ci/phase4/b12/t081-release-recovery-no-write.test.mjs|JANTA_BOL_PHASE_4_WORKING/b12/P4_T081_CURRENT_RELEASE_PREFLIGHT_20261031.md) ;;
              *) echo "T081_OUT_OF_SCOPE_CHANGE=$path"; exit 1 ;;
            esac
          done
          echo 'T081_PROD_SOURCE_DIFF=NONE'
          echo 'T081_CURRENT_POINT_E8=NOT_PROVEN'
          echo 'T081_RELEASE_ROLLBACK_EXECUTION=NOT_RUN'
          echo 'T081_FINAL_PASS_LOCK=HOLD'
