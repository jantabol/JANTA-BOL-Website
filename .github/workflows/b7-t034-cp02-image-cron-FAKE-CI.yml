# P4-T034 CP-02: no project secrets, NO LIVE Supabase or B2 connection.
# Pinned image is evidence candidate; this job must prove actual runtime before G3.
name: T034 CP02 pinned Supabase PG17 image and inert cron (FAKE ONLY)
on:
  push:
    branches:
      - review/t034-cp02-fix-20261015
    paths:
      - '.github/workflows/b7-t034-cp02-image-cron-FAKE-CI.yml'
      - 'ci/backup/jb-t034-offline-full-pg-restore.sh'
      - 'ci/backup/jb-t034-image-contract.sh'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/b7-t034-cp02-image-cron-FAKE-CI.yml'
      - 'ci/backup/jb-t034-offline-full-pg-restore.sh'
      - 'ci/backup/jb-t034-image-contract.sh'
permissions:
  contents: read
jobs:
  pinned-image-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: No real secrets, same image contract and SQL-script preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -z "${SUPABASE_DB_PASSWORD:-}" && -z "${JB_BACKUP_B2_APPLICATION_KEY:-}" && -z "${JB_BACKUP_AGE_RECIPIENT:-}" ]]
          bash -n ci/backup/jb-t034-image-contract.sh
          bash -n ci/backup/jb-t034-offline-full-pg-restore.sh
          grep -Fq 'cron.launch_active_jobs=off' ci/backup/jb-t034-image-contract.sh
          echo 'PASS CP02 fake preflight: no real credentials; reviewed restore helper syntax valid'
      - name: Pin exact image digest, run networkless clone and inspect runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          source ci/backup/jb-t034-image-contract.sh
          [[ "${JB_T034_IMAGE}" == 'supabase/postgres@sha256:3e2a7ab48783077d0122dc72ed5174afb543110c38266c845716c51d130658e4' ]]
          docker pull --platform linux/amd64 "${JB_T034_IMAGE}" >/dev/null
          arch="$(docker image inspect "${JB_T034_IMAGE}" --format '{{.Architecture}}')"
          os="$(docker image inspect "${JB_T034_IMAGE}" --format '{{.Os}}')"
          [[ "$arch" == amd64 && "$os" == linux ]]
          n="t034-cp02-fake-$$"
          t="$(mktemp -d)"
          cleanup(){ docker rm -f "$n" >/dev/null 2>&1 || true; rm -rf -- "$t"; }
          trap cleanup EXIT
          # These args must also be used by the real offline full-restore helper;
          # cron must be inert from first startup, not after restore.
          docker run --platform linux/amd64 -d --network none --memory 4g --cpus 2 --pids-limit 200 \
            --name "$n" -e POSTGRES_PASSWORD=FAKE_NEVER_EXTERNAL \
            "${JB_T034_IMAGE}" "${JB_T034_START_ARGS[@]}" >/dev/null
          stable=0
          for i in $(seq 1 100); do
            if docker exec -u postgres "$n" psql -X -At -d postgres -c 'SELECT 1' \
              2>/dev/null | grep -Fxq 1; then
              stable=$((stable+1)); [[ "$stable" -ge 6 ]] && break
            else stable=0; fi
            sleep 2
          done
          [[ "$stable" -ge 6 ]] || { echo 'FAIL: pinned image did not boot stably'; exit 1; }
          q(){ docker exec -u postgres "$n" psql -X -At -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -c "$1"; }
          v="$(q 'SHOW server_version_num')"
          [[ "$v" =~ ^17[0-9]+$ ]] || { echo 'FAIL: server major not PG17'; exit 1; }
          cron_enabled="$(q 'SHOW cron.launch_active_jobs')"
          [[ "$cron_enabled" == off ]] || { echo 'FAIL: cron scheduler not disabled from first boot'; exit 1; }
          cron_db="$(q 'SHOW cron.database_name')"
          [[ "$cron_db" == postgres ]] || { echo 'FAIL: cron database not postgres'; exit 1; }
          net_db="$(q 'SHOW pg_net.database_name')"
          [[ "$net_db" == template1 ]] || { echo 'FAIL: pg_net worker may access restored postgres'; exit 1; }
          loaded="$(q "SELECT count(*) FROM unnest(string_to_array(replace(current_setting('shared_preload_libraries'),' ',''),',')) AS x(name) WHERE name IN ('pg_cron','pg_net')")"
          [[ "$loaded" == 2 ]] || { echo 'FAIL: shared preload missing cron or net'; exit 1; }
          echo 'PASS [CP02 image]: matched amd64 immutable image, PG17 cron inert + net routed away from postgres'
          q "SELECT name,version FROM pg_available_extension_versions WHERE (name,version) IN
               (('pg_net','0.20.4'),('pg_cron','1.6.4'),('supabase_vault','0.3.1'),
                ('pg_stat_statements','1.11'),('pgcrypto','1.3'),
                ('plpgsql','1.0'),('uuid-ossp','1.1')) ORDER BY name" > "$t/available.txt"
          [[ "$(wc -l < "$t/available.txt")" == 7 ]] || {
            echo 'FAIL: one or more source extension versions unavailable'; exit 1;
          }
          q 'CREATE EXTENSION IF NOT EXISTS pg_cron WITH SCHEMA pg_catalog' >/dev/null
          q 'CREATE EXTENSION IF NOT EXISTS pg_net' >/dev/null
          q "SELECT extname,extversion FROM pg_extension WHERE extname IN ('pg_net','pg_cron') ORDER BY extname" > "$t/loaded.txt"
          grep -Fxq 'pg_cron|1.6.4' "$t/loaded.txt" || { echo 'FAIL: pg_cron runtime version'; exit 1; }
          grep -Fxq 'pg_net|0.20.4' "$t/loaded.txt" || { echo 'FAIL: pg_net runtime version'; exit 1; }
          echo 'PASS [CP02 image]: seven source extension versions available, pg_cron + pg_net load correct versions'
          q 'CREATE TABLE public.t034_fake_cron_marker (id integer)' >/dev/null
          q "SELECT cron.schedule('* * * * *', 'INSERT INTO public.t034_fake_cron_marker VALUES (1)')" > "$t/scheduled.txt"
          # Completely fake loopback URL, networkless clone. The pg_net worker
          # MUST NOT process restored-postgres queues when routed to template1.
          net_before="$(q 'SELECT count(*) FROM net._http_response')"
          net_id="$(q "SELECT net.http_get('http://127.0.0.1:9/t034-synthetic-only')")"
          [[ "$net_id" =~ ^[0-9]+$ ]] || { echo 'FAIL: fake pg_net queue insert unavailable'; exit 1; }
          sleep 75
          [[ "$(q 'SELECT count(*) FROM public.t034_fake_cron_marker')" == 0 ]] || {
            echo 'FAIL: inert cron scheduling claim false'; exit 1;
          }
          [[ "$(q 'SHOW cron.launch_active_jobs')" == off ]] || exit 1
          net_after="$(q 'SELECT count(*) FROM net._http_response')"
          [[ "$net_after" == "$net_before" ]] || { echo 'FAIL: pg_net worker processed fake queue'; exit 1; }
          [[ "$(q "SELECT count(*) FROM net.http_request_queue WHERE id=$net_id")" == 1 ]] ||
            { echo 'FAIL: pg_net fake queue was unexpectedly consumed'; exit 1; }
          echo 'PASS [CP02 cron/net]: active cron and pg_net fake requests stayed inert; metadata preserved'
          echo 'SYNTHETIC ONLY; NO LIVE DB, B2, owner key, GitHub data artifacts, port or network'
