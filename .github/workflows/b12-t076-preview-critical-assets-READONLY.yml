name: B12 T076 exact Hobby preview linked assets LIVE READONLY (No Auth / No Paid)
on:
  push:
    branches: [codex/b12-b0-b12-reconcile-20261028]
    paths:
      - '.github/workflows/b12-t076-preview-critical-assets-READONLY.yml'
      - 'ci/phase4/b12/t076-preview-critical-static-assets-readonly.test.mjs'
permissions:
  contents: read
jobs:
  source_asset_integrity:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && github.ref == 'refs/heads/codex/b12-b0-b12-reconcile-20261028' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: No private environment or production write authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'jantabol/JANTA-BOL-Website'
          test "$GITHUB_REF" = 'refs/heads/codex/b12-b0-b12-reconcile-20261028'
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${CRICKET_DATABASE_URL:-}"
          node --check ci/phase4/b12/t076-preview-critical-static-assets-readonly.test.mjs
      - name: Real HTTPS GET 9 page shells and their actual linked static assets
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test ci/phase4/b12/t076-preview-critical-static-assets-readonly.test.mjs
          echo 'T076_PREVIEW_CRITICAL_HTML_JS_CSS=PASS_SCOPED_REAL'
          echo 'T076_PRODUCTION_RELEASE_OR_FOUNDER_AUTH=HOLD'
