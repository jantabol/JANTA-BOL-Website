name: B7 T042 CP05 FREE News Contact vs First Paid Release Hold (READ ONLY)
on:
  push:
    branches:
      - review/t042-no-paid-final-audit-20261016
    paths:
      - '.github/workflows/b7-t042-cp05-free-softlaunch-firstpaid-separation.yml'
      - 'ci/phase4/b7-t034-cp16-contact-only-softlaunch.test.cjs'
      - 'ci/phase4/b7-t042-cp03-source-authority.test.cjs'
      - 'ci/phase4/b7-t042-no-paid-final-audit.test.cjs'
      - 'JANTA_BOL_PHASE_3C_WORKING/advertise-request.html'
      - 'JANTA_BOL_PHASE_3C_WORKING/supabase-config.js'
      - 'JANTA_BOL_PHASE_4_WORKING/review/B7_FINAL_ZIP_CLOSURE_MANIFEST.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-public-empty-feed:
    name: Two authenticated-by-publishable-key ANON live GET only, homepage/article
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify unmodified source from T034 CP16 and GET TWO live public feeds
        run: node ci/phase4/b7-t034-cp16-contact-only-softlaunch.test.cjs
      - name: Preserve original 60 ADS and exact first-paid gate as DUE
        run: |
          node ci/phase4/b7-closure-gate.cjs --audit
          node --test ci/phase4/b7-closure-regression.cjs
          node --test ci/phase4/b7-issue-coverage.test.cjs
  no-rebuild-source-preservation:
    name: Protected News security + contact-only after no-paid source merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Protected original Phase3 STATIC architecture and regression
        run: |
          node ci/phase3-regression/static-regression.cjs
          node ci/phase3-regression/static-security-architecture-regression.cjs
          node ci/phase3-regression/static-p3-security-regression.cjs
          node ci/phase3-regression/coverage-audit.cjs
      - name: Original B7 public request and client secret exclusions
        run: |
          node --test ci/phase4/b7-public-ad-cta-android.test.cjs
          node ci/phase4/b7-public-secret-scan.cjs
