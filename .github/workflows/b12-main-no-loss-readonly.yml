name: B12 Main No-Loss Reconciliation (READ ONLY — No Release)

on:
  push:
    branches:
      - codex/softlaunch-no-loss-main-reconcile-20261029
    paths:
      - 'ci/phase4/b12/main-no-loss-readonly-gate.cjs'
      - '.github/workflows/b12-main-no-loss-readonly.yml'
  pull_request:
    branches:
      - codex/v3-c1-news-founder-preserve-20261028
    paths:
      - 'ci/phase4/b12/main-no-loss-readonly-gate.cjs'
      - '.github/workflows/b12-main-no-loss-readonly.yml'
permissions:
  contents: read
concurrency:
  group: jb-main-no-loss-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inspect-merge-tree:
    name: Real Main-vs-V3 Merge Tree — Fail Closed on Conflicts / Lost Files
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout candidate — full Git ancestry, no persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Obtain latest protected Main ref (read-only)
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Verify no-loss merge tree (no merge, push, or deployment)
        run: |
          git --version
          node --check ci/phase4/b12/main-no-loss-readonly-gate.cjs
          node ci/phase4/b12/main-no-loss-readonly-gate.cjs
