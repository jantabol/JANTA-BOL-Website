# JANTA BOL / T034 CP-RCA-2: synthetic-only logger/diagnostics integration.
# NO GitHub Production Environment, NO B2, NO Supabase and NO real identities.
name: T034 RCA2 diagnostic SQLSTATE, privacy and networkless startup FAKE CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/backup/**'
      - '.github/workflows/b7-t034-restore-diagnostics-FAKE-CI.yml'
      - '.github/workflows/b7-t034-dual-recipient-real-MANUAL.yml'
  push:
    branches: [review/t034-cp-rca2-safe-diagnostics-20261015]
permissions:
  contents: read
jobs:
  fake-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned
      - name: No secrets and syntax checks
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -z "${SUPABASE_DB_PASSWORD:-}" && -z "${JB_BACKUP_B2_APPLICATION_KEY:-}" ]]
          [[ -z "${JB_BACKUP_AGE_RECIPIENT:-}" ]]
          bash -n ci/backup/jb-t034-offline-full-pg-restore.sh
          bash -n ci/backup/jb-t034-image-contract.sh
          python3 -m py_compile ci/backup/jb-t034-restore-diagnostics.py
          python3 ci/backup/jb-t034-manual-release-static-gate.py .github/workflows/b7-t034-dual-recipient-real-MANUAL.yml
          echo 'PASS RCA2 FAKE preflight and unchanged approval gate'
      - name: Privacy, first-error, wrong-actor and failed-process negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s ci/backup -p 'test_jb_t034_restore_diagnostics.py' -v
          echo 'PASS RCA2 FAKE fail-closed structured diagnostic schema'
      - name: Pinned PostgreSQL image networkless logger, scheduler and deliberate SQL error
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          source ci/backup/jb-t034-image-contract.sh
          clone="t034-rca2-fake-$GITHUB_RUN_ID"
          t="$(mktemp -d)"
          cleanup() {
            docker rm -f "$clone" >/dev/null 2>&1 || true
            rm -rf -- "$t"
          }
          trap cleanup EXIT HUP INT TERM
          docker run --platform "$JB_T034_PLATFORM" -d --network none --log-driver none \
            --memory 4g --cpus 2 --pids-limit 200 \
            --name "$clone" -e POSTGRES_PASSWORD=FAKE_ONLY \
            "$JB_T034_IMAGE" "${JB_T034_START_ARGS[@]}" \
            -c logging_collector=on -c log_destination=jsonlog \
            -c log_directory=/tmp/t034-private-json -c log_filename=t034 \
            -c log_file_mode=0600 -c log_min_error_statement=panic \
            -c log_statement=none -c log_error_verbosity=terse \
            -c log_parameter_max_length_on_error=0 >/dev/null
          stable=0
          for i in $(seq 1 100); do
            if docker exec -u postgres "$clone" psql -X -At -v ON_ERROR_STOP=1 \
                 -U supabase_admin -d postgres -c 'SELECT 1' 2>/dev/null | grep -Fxq 1; then
              stable=$((stable+1))
              [[ "$stable" -ge 6 ]] && break
            else
              stable=0
            fi
            sleep 2
          done
          [[ "$stable" -ge 6 ]] || { echo 'HOLD RCA2 fake startup'; exit 1; }
          [[ "$(docker inspect "$clone" --format '{{.HostConfig.LogConfig.Type}}')" == none ]]
          q() { docker exec -u postgres "$clone" psql -X -At -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -c "$1"; }
          settings="$(q "SELECT current_setting('cron.database_name') || '|' ||
            current_setting('cron.launch_active_jobs') || '|' ||
            current_setting('pg_net.database_name') || '|' ||
            current_setting('logging_collector') || '|' ||
            current_setting('log_destination') || '|' ||
            current_setting('log_statement')")"
          [[ "$settings" == 'postgres|off|template1|on|jsonlog|none' ]] ||
            { echo 'HOLD RCA2 cron, net or logging changed'; exit 1; }
          extensions="$(q "SELECT count(*) FROM pg_available_extension_versions WHERE (name,version) IN
            (('pg_net','0.20.4'),('pg_cron','1.6.4'),('supabase_vault','0.3.1'),
             ('pg_stat_statements','1.11'),('pgcrypto','1.3'),('plpgsql','1.0'),
             ('uuid-ossp','1.1'))")"
          [[ "$extensions" == 7 ]] || { echo 'HOLD RCA2 pinned extension drift'; exit 1; }
          echo 'PASS RCA2 FAKE same pinned image, 7 extensions, cron/net isolation and private JSON logging'
          q 'CREATE TABLE public.t034_rca2_fake (id bigint PRIMARY KEY);' >/dev/null
          docker exec -u postgres "$clone" pg_dump -U supabase_admin -d postgres \
            -Fc -t public.t034_rca2_fake -f /tmp/t034-fake.dump >/dev/null
          docker exec -u postgres "$clone" pg_restore --list /tmp/t034-fake.dump > "$t/toc"
          outer_rc=0
          if docker exec -u postgres -e PGAPPNAME=jb_t034_full_restore "$clone" sh -c '
            pg_restore --verbose -U supabase_admin -d postgres --exit-on-error /tmp/t034-fake.dump
            rc=$?
            printf "%s\n" "$rc" > /tmp/t034-pg-restore-exit
            exit "$rc"
          ' > "$t/restore.log" 2>&1; then
            echo 'HOLD RCA2 deliberate duplicate-table restore unexpectedly succeeded'
            exit 1
          else
            outer_rc=$?
          fi
          [[ "$outer_rc" -ne 0 ]] || exit 1
          docker cp "$clone:/tmp/t034-pg-restore-exit" "$t/inner_rc" >/dev/null 2>&1 ||
            { echo 'HOLD RCA2 inner marker missing'; exit 1; }
          inner_rc="$(cat "$t/inner_rc")"
          state="$(docker inspect "$clone" --format '{{.State.Running}}|{{.State.OOMKilled}}')"
          mkdir -m 700 "$t/json"
          docker cp "$clone:/tmp/t034-private-json/." "$t/json/" >/dev/null 2>&1 ||
            { echo 'HOLD RCA2 JSON collector missing'; exit 1; }
          python3 ci/backup/jb-t034-restore-diagnostics.py capture \
            --client-log "$t/restore.log" --json-dir "$t/json" --toc "$t/toc" \
            --outer-rc "$outer_rc" --inner-rc "$inner_rc" \
            --container-state "$state" --out "$t/safe.json" > "$t/parse.out" 2> "$t/parse.err" ||
            { echo 'HOLD RCA2 fake parser failed'; exit 1; }
          python3 ci/backup/jb-t034-restore-diagnostics.py emit --report "$t/safe.json" > "$t/safe.txt" ||
            { echo 'HOLD RCA2 safe report invalid'; exit 1; }
          grep -Fxq 'T034_RESTORE_SQLSTATE=42P07' "$t/safe.txt" ||
            { echo 'HOLD RCA2 real fake SQLSTATE not correlated'; exit 1; }
          grep -Fxq 'T034_FAILURE_CHANNEL=SERVER_SQL' "$t/safe.txt" ||
            { echo 'HOLD RCA2 fake failure incorrectly classified'; exit 1; }
          grep -Fxq 'T034_FIRST_TOC_TYPE=TABLE' "$t/safe.txt" ||
            { echo 'HOLD RCA2 error TOC context missing'; exit 1; }
          grep -Fxq 'T034_DIAGNOSTIC_COMPLETENESS=CORRELATED' "$t/safe.txt" ||
            { echo 'HOLD RCA2 first error incomplete'; exit 1; }
          echo 'PASS RCA2 FAKE real PG17 SQLSTATE 42P07 + numeric TOC + safe output'
          echo 'NO real data, no B2 access, no owner key, no raw artifact'
