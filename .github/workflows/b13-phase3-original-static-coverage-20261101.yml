# Read-only old Phase-3 11-part static protection on B13 current source;
# NOT the historical full transactional Phase-3 CI (DB cannot safely be run
# without explicit isolated target and true credentials).
name: B13 Original Phase3 11 Static Regression — NO DB
on:
  push:
    branches: [codex/b13-t085-crossmodule-source-check-20261101]
    paths:
      - '.github/workflows/b13-phase3-original-static-coverage-20261101.yml'
      - '.github/workflows/b13-t085-crossmodule-readonly-20261101.yml'
      - 'JANTA_BOL_PHASE_4_WORKING/b13/P4_B13_MASTER_PDF_AUTHORITY_CROSSWALK_20261101.md'
      - 'JANTA_BOL_PHASE_4_WORKING/b13/P4_B13_PHASE3_STATIC_REPLAY_EVIDENCE_20261101.md'
  pull_request:
    branches: [codex/b12-t080-integration-candidate-20261101]
permissions:
  contents: read
concurrency:
  group: b13-old-phase3-static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-11-part-static-on-current-review-source:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only exact branch checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Zero secret, zero database, zero paid action boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${PGPASSWORD:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          node --version
          echo "PHASE3_ORIGINAL_11_STATIC_NOT_DB=STARTED"
      - name: 1. Original Phase3 primary source static
        run: node ci/phase3-regression/static-regression.cjs
      - name: 2. Original Phase3 Auth/Security architecture
        run: node ci/phase3-regression/static-security-architecture-regression.cjs
      - name: 3. Original Phase3 P1 functional
        run: node ci/phase3-regression/static-p1-functional-regression.cjs
      - name: 4. Original Phase3 P2 core provider
        run: node ci/phase3-regression/static-p2-core-regression.cjs
      - name: 5. Original Phase3 P2 recovery
        run: node ci/phase3-regression/static-p2-recovery-regression.cjs
      - name: 6. Original Phase3 P3 security
        run: node ci/phase3-regression/static-p3-security-regression.cjs
      - name: 7. Original Phase3 P3 recovery
        run: node ci/phase3-regression/static-p3-recovery-regression.cjs
      - name: 8. Original Phase3 P3 incident
        run: node ci/phase3-regression/static-p3-incident-regression.cjs
      - name: 9. Original Phase3 P3 preprod
        run: node ci/phase3-regression/static-p3-preprod-regression.cjs
      - name: 10. Original Phase3 P3-final+P4-governance
        run: node ci/phase3-regression/static-p3-final-p4-regression.cjs
      - name: 11. Original Phase3 exact coverage audit
        run: node ci/phase3-regression/coverage-audit.cjs
      - name: Never manufacture complete Phase3 E1 from only static checks
        shell: bash
        run: |
          echo "B13_PHASE3_ORIGINAL_STATIC=PASS_SCOPED"
          echo "B13_PHASE3_ORIGINAL_DB_TRANSACTIONAL=NOT_RUN"
          echo "B13_ALL_PROTECTED_PHASE3_FULL_GREEN=NOT_PROVEN"
          echo "B12_FINAL_LOCK=HOLD"
          echo "B13_FORMAL_RUN15=NOT_RUN"
          echo "REAL_PRODUCTION_AND_DB_MUTATIONS=NONE"
