name: P4-T036 CP03 PG17 expiry audit + crash retry (NO LIVE)
on:
  push:
    branches:
      - review/t036-schedule-lifecycle-20261016
permissions:
  contents: read
jobs:
  expiry-owner-source-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Reject live secrets or hosted operations
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(printenv SUPABASE_ACCESS_TOKEN || true)"
          test -z "$(printenv SUPABASE_SERVICE_ROLE_KEY || true)"
          test -z "$(printenv SUPABASE_DB_PASSWORD || true)"
          echo 'T036_CP03_NO_CRON_NO_PROD_NO_PAYMENTS'
      - name: Check honest E2/E5 DUE and no public or news write authority
        run: node ci/phase4/b7-t036-cp03-source-gate.cjs
      - name: Reverify legacy app unaffected
        run: |
          node --test ci/phase4/b7-client-regression.cjs
          node --test ci/phase4/b7-lifecycle-client-gate.test.cjs
          node ci/phase4/b7-closure-gate.cjs --audit
  real-disposable-postgresql-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: ci_local_only, POSTGRES_DB: b7_t036_cp03}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d b7_t036_cp03"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_local_only
      PGDATABASE: b7_t036_cp03
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Create synthetic original campaign and audit tables (LOCAL ONLY)
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b7-payment-fixture.sql
      - name: Apply SQL reviewed candidate ONLY inside disposable PostgreSQL 17
        run: psql -X -v ON_ERROR_STOP=1 -f JANTA_BOL_PHASE_4_WORKING/db/20261016_b7_t036_expiry_replay_REVIEW_ONLY.sql
      - name: Test batch/clock/grants/finance-integrity/crash-rollback/retry and ROLLBACK
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b7-t036-cp03-expiry-replay-regression.sql
