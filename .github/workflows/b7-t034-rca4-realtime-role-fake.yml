             -U supabase_admin -d template1 -f /tmp/role.sql \
             > "$tmp/security-negative.log" 2>&1; then
            echo 'HOLD RCA4 privilege escalation not rejected'
            exit 1
          fi
          echo 'T034_RCA4_FAKE_TYPE_RESTORE_AFTER_EXACT_ROLE=PASS'
          echo 'T034_RCA4_ROLE_IDEMPOTENCE_AND_ESCALATION_NEGATIVE=PASS'
          echo 'NO LIVE SQL, B2, real archive, owner key, open Docker port or production change'
