      - name: Reproduce missing TYPE owner then fix on pinned isolated PG17 clone
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          source ci/backup/jb-t034-image-contract.sh
          clone="jb-t034-rca4-fake-$GITHUB_RUN_ID"
          tmp="$(mktemp -d)"
          cleanup(){
            docker rm -f "$clone" >/dev/null 2>&1 || true
            rm -rf -- "$tmp"
