            -U supabase_admin -d postgres /tmp/t034-fake-owned-type.dump \
            > "$tmp/fail.log" 2>&1; then
            echo 'HOLD RCA4 deliberately absent fake TYPE owner did not fail'
            exit 1
          fi
          grep -Eq 'role "supabase_realtime_admin" does not exist' "$tmp/fail.log" ||
            { echo 'HOLD RCA4 fake failure did not prove missing role'; exit 1; }
          grep -Eq 'from TOC entry [0-9]+; .* TYPE ' "$tmp/fail.log" ||
            { echo 'HOLD RCA4 fake failure not correlated to TYPE TOC'; exit 1; }
          echo 'T034_RCA4_FAKE_PG_RESTORE_TYPE_OWNER_MISSING_REPRO=PASS'
          q 'DROP SCHEMA IF EXISTS t034_rca4 CASCADE' >/dev/null
          docker exec -u postgres "$clone" psql -X -qAt -v ON_ERROR_STOP=1 -U supabase_admin -d template1 \
            -f /tmp/role.sql > "$tmp/role2.log" 2>&1 ||
            { echo 'HOLD RCA4 corrected disposable role replay failed'; exit 1; }
          docker exec -u postgres "$clone" pg_restore --exit-on-error \
            -U supabase_admin -d postgres /tmp/t034-fake-owned-type.dump \
            > "$tmp/fixed.log" 2>&1 ||
            { echo 'HOLD RCA4 same fake TYPE archive did not restore after safe role'; exit 1; }
          owner="$(q "SELECT pg_get_userbyid(t.typowner) FROM pg_type t JOIN pg_namespace n ON n.oid=t.typnamespace WHERE n.nspname='t034_rca4' AND t.typname='fake_enum'")"
          [[ "$owner" == supabase_realtime_admin ]] || { echo 'HOLD RCA4 owned TYPE changed'; exit 1; }
          flags="$(q "SELECT rolcanlogin||'|'||rolinherit||'|'||rolcreaterole||'|'||rolbypassrls FROM pg_roles WHERE rolname='supabase_realtime_admin'")"
          [[ "$flags" == 'false|false|false|false' || "$flags" == 'f|f|f|f' ]] ||
            { echo 'HOLD RCA4 role unexpectedly privileged'; exit 1; }
          docker exec -u postgres "$clone" psql -X -qAt -v ON_ERROR_STOP=1 -U supabase_admin -d template1 \
            -f /tmp/role.sql > "$tmp/idempotent.log" 2>&1 ||
            { echo 'HOLD RCA4 role replay not idempotent'; exit 1; }
          q "ALTER ROLE supabase_realtime_admin CREATEROLE" >/dev/null
