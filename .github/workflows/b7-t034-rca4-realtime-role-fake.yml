          trap cleanup EXIT HUP INT TERM
          docker run -d --platform "$JB_T034_PLATFORM" --network none --log-driver none \
            --memory 4g --cpus 2 --pids-limit 200 \
            --name "$clone" -e POSTGRES_PASSWORD=FAKE_ONLY \
            "$JB_T034_IMAGE" "${JB_T034_START_ARGS[@]}" >/dev/null
          stable=0
          for i in $(seq 1 100); do
            if docker exec -u postgres "$clone" psql -X -At -v ON_ERROR_STOP=1 \
              -U supabase_admin -d postgres -c 'SELECT 1' 2>/dev/null | grep -Fxq 1; then
              stable=$((stable+1)); [[ "$stable" -ge 6 ]] && break
            else
              stable=0
            fi
            sleep 2
          done
          [[ "$stable" -ge 6 ]] || { echo 'HOLD RCA4 fake PG bootstrap'; exit 1; }
          q(){ docker exec -u postgres "$clone" psql -X -At -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -c "$1"; }
          safe="$(q "SELECT current_setting('cron.database_name')||'|'||current_setting('cron.launch_active_jobs')||'|'||current_setting('pg_net.database_name')")"
          [[ "$safe" == 'postgres|off|template1' ]] || { echo 'HOLD RCA4 fake worker isolation'; exit 1; }
          test "$(q "SELECT count(*) FROM pg_roles WHERE rolname='supabase_realtime_admin'")" = 0 ||
             { echo 'HOLD RCA4 missing role expected by this exact pinned image'; exit 1; }
          docker cp ci/backup/jb-t034-disposable-realtime-role.sql "$clone:/tmp/role.sql" >/dev/null
          docker exec -u root "$clone" chown postgres:postgres /tmp/role.sql >/dev/null
          docker exec -u postgres "$clone" psql -X -qAt -v ON_ERROR_STOP=1 -U supabase_admin -d template1 \
            -f /tmp/role.sql > "$tmp/role1.log" 2>&1 ||
            { echo 'HOLD RCA4 safe role replay failed'; exit 1; }
          grep -Fxq 'T034_TARGET_REALTIME_ROLE_SECURITY_REPLAY=PASS' "$tmp/role1.log" ||
            { echo 'HOLD RCA4 initial role proof'; exit 1; }
          q "CREATE SCHEMA t034_rca4 AUTHORIZATION supabase_admin;
             CREATE TYPE t034_rca4.fake_enum AS ENUM ('FAKE');
             ALTER TYPE t034_rca4.fake_enum OWNER TO supabase_realtime_admin" > /dev/null
          docker exec -u postgres "$clone" pg_dump -U supabase_admin -Fc -n t034_rca4 \
            -f /tmp/t034-fake-owned-type.dump -d postgres >/dev/null
          q 'DROP SCHEMA t034_rca4 CASCADE' > /dev/null
          q 'REVOKE anon, authenticated, service_role FROM supabase_realtime_admin;
             DROP ROLE supabase_realtime_admin' > /dev/null
          test "$(q "SELECT count(*) FROM pg_roles WHERE rolname='supabase_realtime_admin'")" = 0
