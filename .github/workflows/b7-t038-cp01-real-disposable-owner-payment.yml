name: P4-T038 CP01 Owner manual payment/consent E1 real disposable CI
on:
  push:
    branches:
      - review/t038-manual-payment-authority-20261016
permissions:
  contents: read
jobs:
  original-owner-client-and-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Strictly no prod credentials or real receipts
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(printenv SUPABASE_ACCESS_TOKEN || true)"
          test -z "$(printenv SUPABASE_SERVICE_ROLE_KEY || true)"
          test -z "$(printenv SUPABASE_DB_PASSWORD || true)"
          echo 'T038_CP01_DISPOSABLE_ONLY; NO_REAL_PAYMENTS; NO_FAKE_E2_E5_E6'
      - name: Official ADS035..040 and Owner UI manual-only source regression
        run: |
          node --check ci/phase4/b7-t038-cp01-manual-payment-source.test.cjs
          node --test ci/phase4/b7-t038-cp01-manual-payment-source.test.cjs
          node --test ci/phase4/b7-legacy-payment-client-gate.test.cjs
          node --test ci/phase4/b7-client-regression.cjs
          node ci/phase4/b7-closure-gate.cjs --audit
  actual-pg17-manual-payment-redline:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: ci_local_only, POSTGRES_DB: jb_t038_cp01}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d jb_t038_cp01"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env: {PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: ci_local_only, PGDATABASE: jb_t038_cp01}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Synthetic original ad/campaign and admin conditions ONLY
        run: |
          psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b7-payment-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f JANTA_BOL_PHASE_4_WORKING/db/20261010_b7_manual_payment_REVIEW_ONLY.sql
      - name: Actual PG17 malicious pre-approval, false consent, UTR replay, high-risk denial, ALL ROLLBACK
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b7-t038-cp01-payment-boundary-regression.sql
  preserved-original-t038-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: ci_local_only, POSTGRES_DB: jb_t038_prior}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d jb_t038_prior"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env: {PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: ci_local_only, PGDATABASE: jb_t038_prior}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Same old protected payment schema and Owner auth fixture
        run: |
          psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b7-payment-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f JANTA_BOL_PHASE_4_WORKING/db/20261010_b7_manual_payment_REVIEW_ONLY.sql
      - name: Preserve all original payment, receipt, Owner, future LIVE tests
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b7-payment-regression.sql
