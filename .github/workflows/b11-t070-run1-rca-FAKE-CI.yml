# T070 real Run #1 FAIL-CLOSED RCA: synthetic unit tests only.
# Pull-request review: NEVER access Supabase/B2/Production secrets or run a restore.
name: T070 Real Run1 Safe RCA (No LIVE)
on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/phase4/b11/t070-joint-storage-snapshot-identity.mjs'
      - 'ci/phase4/b11/t070-joint-storage-snapshot-identity.test.mjs'
      - '.github/workflows/b11-t070-run1-rca-FAKE-CI.yml'
permissions:
  contents: read
jobs:
  t070_rca_synthetic_only:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify JS parser and fail-closed original object identity/microseconds/privacy classifications
        run: |
          set -Eeuo pipefail
          node --check ci/phase4/b11/t070-joint-storage-snapshot-identity.mjs
          node --test ci/phase4/b11/t070-joint-storage-snapshot-identity.test.mjs
      - name: Verify Founder/manual real joint restore safety contract on fake source
        run: node --test ci/phase4/b11/t070-real-joint-manual-safety.test.mjs
      - name: Reject production secrets and real restore claims
        run: |
          set -Eeuo pipefail
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          echo 'T070_RUN1_RCA_SYNTHETIC_TESTS=PASS; REAL_JOINT_RESTORE=HOLD'
