name: B12 T076 real PRODUCTION HTTPS and source baseline READONLY preflight
on:
  push:
    branches: [codex/b12-t076-production-hosting-readonly-20261028]
    paths:
      - '.github/workflows/b12-t076-production-readonly-preflight.yml'
      - 'ci/phase4/b12/t076-real-vercel-https-readonly.test.mjs'
permissions:
  contents: read
jobs:
  safe_public_http_no_prod_write:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && github.ref == 'refs/heads/codex/b12-t076-production-hosting-readonly-20261028' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Public-only source identity fence, never use Supabase/B2/Vercel secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'jantabol/JANTA-BOL-Website'
          test "$GITHUB_REF" = 'refs/heads/codex/b12-t076-production-hosting-readonly-20261028'
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${CRICKET_DATABASE_URL:-}"
          node --check ci/phase4/b12/t076-real-vercel-https-readonly.test.mjs
          echo 'T076_ORIGINAL_MAIN_SOURCE_NO_SECRET_READONLY_REPO_FENCE=PASS'
      - name: Execute real public HTTPS and static editorial release-hold probes
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test ci/phase4/b12/t076-real-vercel-https-readonly.test.mjs
          echo 'T076_REAL_PUBLIC_HTTPS_SOURCE_SCOPED=PASS'
          echo 'T076_HOSTING_METADATA_NOT_AUTH_ADMIN_PURL_EVIDENCE=HOLD'
          echo 'T076_FULL_FINAL_PASS_LOCK=false'
