name: B11 T072 proposed durable Owner request key browser race + original B8 regression (NO PROD)
on:
  push:
    branches: [codex/b11-t072-client-durable-key-isolated-proposal-20261028]
    paths:
      - 'ci/phase4/b11/t072-durable-owner-idempotency-CLIENT_PROPOSAL_ONLY.mjs'
      - 'ci/phase4/b11/t072-durable-owner-idempotency-client.test.mjs'
      - '.github/workflows/b11-t072-protected-durable-client-PROPOSAL_ONLY.yml'
permissions:
  contents: read
jobs:
  candidate_owner_case_browser_safety:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && github.ref == 'refs/heads/codex/b11-t072-client-durable-key-isolated-proposal-20261028' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout protected review-only candidate, no saved token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Security boundary no production/Cricket resources or secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = jantabol/JANTA-BOL-Website
          test "$GITHUB_REF" = refs/heads/codex/b11-t072-client-durable-key-isolated-proposal-20261028
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          test -z "${CRICKET_DATABASE_URL:-}"
          echo 'T072_DURABLE_CLIENT_ONLY_NO_LIVE_SECRETS=PASS'
      - name: Execute proposed durable owner key retry, same-key ACK, races, actor and storage negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test ci/phase4/b11/t072-durable-owner-idempotency-client.test.mjs
          echo 'T072_DURABLE_CLIENT_BROWSER_ISOLATED=PASS_SCOPED_NO_PROD'
      - name: Checkout unchanged original full B8 workflow and Android test source for legacy regression
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 89849ba47f443f423d8bfe4f966bb2d38087201f
          path: protected-original-b8
          persist-credentials: false
      - name: Independently verify old B8 tests still green; candidate NOT wired to old UI
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C protected-original-b8 rev-parse HEAD)" = 89849ba47f443f423d8bfe4f966bb2d38087201f
          (
            cd protected-original-b8
            node --test \
              ci/phase4/b8-g3-cp01-android-workflow.test.mjs \
              ci/phase4/b8-g1-mobile-case-picker.test.mjs
          )
          echo 'T072_ORIGINAL_B8_UNMODIFIED_ANDROID_LEGACY_REGRESSION=PASS_SCOPED'
          echo 'T072_CLIENT_PROPOSAL_INTEGRATED=false'
          echo 'T072_ORIGINAL_RPC_DUPLICATE_P2_STILL_OPEN=true'
          echo 'T072_FINAL_PASS_LOCK=false'
          echo 'T075_FULL_E8=HOLD'
