name: P4-T076 Exact Integrated V3 Preview HTTPS — Readonly E1 E6

on:
  push:
    branches:
      - codex/softlaunch-no-loss-main-reconcile-20261029
    paths:
      - 'ci/phase4/b12/t076-final-candidate-hosted-readonly.test.cjs'
      - '.github/workflows/b12-t076-final-candidate-https-readonly.yml'
  pull_request:
    branches:
      - codex/v3-c1-news-founder-preserve-20261028
    paths:
      - 'ci/phase4/b12/t076-final-candidate-hosted-readonly.test.cjs'
      - '.github/workflows/b12-t076-final-candidate-https-readonly.yml'

permissions:
  contents: read

concurrency:
  group: jb-t076-actual-https-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hosted-guest-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      JB_STAGE_VERIFIED_SHA: 2623bfe17e70c9618821199b4b4f09b1c34e41c1
    steps:
      - name: Read regression suite on review-only PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: test
      - name: Read EXACT Vercel staged commit source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: 2623bfe17e70c9618821199b4b4f09b1c34e41c1
          path: src
      - name: Pinned zero-credential real HTTPS GET and asset byte-integrity tests
        shell: bash
        working-directory: src
        run: node --test ../test/ci/phase4/b12/t076-final-candidate-hosted-readonly.test.cjs
