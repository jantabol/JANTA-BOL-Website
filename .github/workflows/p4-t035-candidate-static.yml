name: P4-T035 Candidate Static Gate
on:
  push:
    branches:
      - codex/p4-t035-reviewed-fixes-20261009
      - codex/b7-reconcile-20261009
      - codex/b7-blueprint-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Phase 3 and 4 static regression
        shell: bash
        run: |
          set -euo pipefail
          node ci/phase3-regression/static-regression.cjs
          node ci/phase3-regression/static-security-architecture-regression.cjs
          node ci/phase3-regression/static-p1-functional-regression.cjs
          node ci/phase3-regression/static-p2-core-regression.cjs
          node ci/phase3-regression/static-p2-recovery-regression.cjs
          node ci/phase3-regression/static-p3-security-regression.cjs
          node ci/phase3-regression/static-p3-recovery-regression.cjs
          node ci/phase3-regression/static-p3-incident-regression.cjs
          node ci/phase3-regression/static-p3-preprod-regression.cjs
          node ci/phase3-regression/static-p3-final-p4-regression.cjs
          node ci/phase4/governance-b0.cjs
          node ci/phase4/static-b1-team-regression.cjs
          node ci/phase4/static-b2-records-regression.cjs
          node ci/phase4/p4-t019-publishing-fault-injection.cjs
          node ci/phase3-regression/coverage-audit.cjs
      - name: P4-T035 candidate contract assertions
        run: node ci/phase4/p4-t035-static-contract.cjs
      - name: Advertisement renderer syntax
        run: node --check JANTA_BOL_PHASE_3C_WORKING/public-ads.js
      - name: B7 article scope and schedule behavior
        run: node --test ci/phase4/b7-client-regression.cjs
      - name: B7 ADS-010/011/015 local Media Studio preflight — no upload or premature media approval
        run: |
          node --check JANTA_BOL_PHASE_3C_WORKING/ad-media-preview.js
          node --test ci/phase4/b7-media-preview-regression.cjs
      - name: B7 G3 official LGD structural CSV preflight regression — synthetic tests only, import DUE
        run: node --test ci/phase4/b7-lgd-source-preflight.test.cjs
      - name: B7 ADS-010/011/015 server media byte and dimension preflight — no sanitization or release claims
        run: node --test ci/phase4/b7-media-byte-policy.test.mjs
      - name: B7 ADS-015 two private buckets, immutable upload, verified readback SHA256 and orphan audit
        run: node --test ci/phase4/b7-media-private-storage.test.mjs
      - name: B7 ADS-015 latest draft to verified private receipt coordinator - no media approval
        run: node --test ci/phase4/b7-media-coordinator.test.mjs
      - name: B7 canonical Creative and restricted media RPC server adapter - no public URLs
        run: node --test ci/phase4/b7-media-server-evidence.test.mjs
      - name: B7 explicit Owner clean-media public release candidate, no Creative approval or raw file leakage
        run: node --test ci/phase4/b7-public-release-worker.test.mjs
      - name: B7 ADS-056 client privileged-secret exposure E1 scan — secrets never printed
        run: |
          node ci/phase4/b7-public-secret-scan.cjs
          node --test ci/phase4/b7-public-secret-scan-regression.cjs
      - name: B7 ADS-001..060 final ZIP coverage preflight — DUE is NOT PASS
        run: |
          node ci/phase4/b7-closure-gate.cjs --audit
          node --test ci/phase4/b7-closure-regression.cjs
      - name: B7 qualified ad viewability isolated signal — never count fake impressions
        run: |
          node --check JANTA_BOL_PHASE_3C_WORKING/ad-viewability.js
          node --test ci/phase4/b7-viewability-regression.cjs
          node --check JANTA_BOL_PHASE_3C_WORKING/ad-analytics-client.js
          node --test ci/phase4/b7-analytics-client-regression.cjs

  b7-media-wasm-preview:
    name: B7 private media real WASM transcode - REVIEW ONLY, no upload or approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Deno TS compile and real private WASM image processing; never Production
        run: |
          deno check CODEX_CURRENT_SUPABASE/functions/_shared/b7-image-sanitize.ts
          deno check CODEX_CURRENT_SUPABASE/functions/jb-ad-media-preview/index.ts
          deno check CODEX_CURRENT_SUPABASE/functions/_shared/b7-private-image-job.ts
          deno test --allow-read --allow-env --allow-ffi ci/phase4/b7-image-sanitize.test.ts ci/phase4/b7-ad-media-gateway.test.ts ci/phase4/b7-ad-owner-auth.test.ts ci/phase4/b7-private-image-job.test.ts

