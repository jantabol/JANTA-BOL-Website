      - name: Install deterministic FFmpeg codec toolchain, no Production use
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -encoders | grep -q libx264
      - name: Syntax and REAL video decode-encode-poster with spoofed/invalid inputs
        run: |
          node --check CODEX_CURRENT_SUPABASE/functions/_shared/b7-video-sanitize.mjs
          node --test ci/phase4/b7-video-sanitize.test.mjs ci/phase4/b7-video-private-stage.test.mjs ci/phase4/b7-video-server-adapter.test.mjs

