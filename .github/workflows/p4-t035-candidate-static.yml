  b7-notification-postgres:
    name: B7 notifications reuse B3 Owner domain with payment, portal and outage fallback (disposable PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: b7_notifications
        ports:
