          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: p4_t035
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p4_t035"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_local_only
      PGDATABASE: p4_t035
    steps:
      - uses: actions/checkout@v4
