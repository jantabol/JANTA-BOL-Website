      - name: Apply review-only migration to disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f JANTA_BOL_PHASE_4_WORKING/db/20261010_b7_public_enquiry_review.sql
      - name: Verify anonymous input, consent, scope, cooldown, legacy denial
