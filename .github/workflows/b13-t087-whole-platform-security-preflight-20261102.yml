            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$JB_T066_DISPOSABLE_JWT_SECRET" \
            postgrest/postgrest:v12.2.3 >/dev/null
          trap 'docker stop jb-t087-t066-postgrest >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ | grep -Eq '^(200|401|403)
        run: |
          set -Eeuo pipefail
          psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b10-t067-incident-contained-audit-notify-pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b10-t068-rollback-safety-final-pg17.sql
  protected_original_g0_g1_news_auth_ads:
    uses: ./.github/workflows/b12-b8-reconciled-protected.yml
    permissions:
      contents: read
; then break; fi
            sleep 1
          done
          node ci/phase4/b10-t066-disposable-signed-revocation.test.mjs red
          psql -X -v ON_ERROR_STOP=1 -f JANTA_BOL_PHASE_4_WORKING/db/20261024_b10_t066_advertiser_active_session_PRODUCTION_APPROVED.sql
          node ci/phase4/b10-t066-disposable-signed-revocation.test.mjs green
      - name: Original T067 immutable incident audit + T068 rollback source safety
        run: |
          set -Eeuo pipefail
          psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b10-t067-incident-contained-audit-notify-pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b10-t068-rollback-safety-final-pg17.sql
