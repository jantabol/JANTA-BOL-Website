# Only FAKE disconnected PostgreSQL; no secrets, B2 or production.
name: T034 RCA9 raw versus effective ACL pg_dump reproduction FAKE
on:
  push:
    branches: [review/t034-rca9-null-vs-default-acl-20261015]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/b7-t034-rca9-acl-default-FAKE.yml'
      - 'ci/backup/jb-t034-security-parity.sql'
permissions:
  contents: read
jobs:
  fake-pg17-null-vs-explicit-owner-default:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reproduce raw ACL representation across real PG17 pg_dump and pg_restore
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          source ci/backup/jb-t034-image-contract.sh
          clone="t034-rca9-fake-$GITHUB_RUN_ID"
          temp="$(mktemp -d)"
          cleanup(){ docker rm -f "$clone" >/dev/null 2>&1 || true; rm -rf -- "$temp"; }
          trap cleanup EXIT HUP INT TERM
          docker run -d --platform "$JB_T034_PLATFORM" --network none --log-driver none \
            --memory 4g --cpus 2 --pids-limit 200 --name "$clone" \
            -e POSTGRES_PASSWORD=FAKE_ONLY "$JB_T034_IMAGE" "${JB_T034_START_ARGS[@]}" >/dev/null
          stable=0
          for i in $(seq 1 100); do
            if docker exec -u postgres "$clone" psql -X -qAt -v ON_ERROR_STOP=1 \
                -U supabase_admin -d postgres -c 'SELECT 1' 2>/dev/null | grep -Fxq 1; then
              stable=$((stable+1)); [[ "$stable" -ge 6 ]] && break
            else stable=0; fi
            sleep 1
          done
          [[ "$stable" -ge 6 ]] || { echo 'T034_RCA9_PG17_BOOT=HOLD'; exit 1; }
          q(){ docker exec -u postgres "$clone" psql -X -qAt -v ON_ERROR_STOP=1 -U supabase_admin -d "$1" -c "$2" 2> "$temp/query.err"; }
          [[ "$(q postgres "SELECT current_setting('cron.launch_active_jobs')||'|'||current_setting('pg_net.database_name')")" == 'off|template1' ]]
          q template1 'CREATE DATABASE t034_rca9_source OWNER supabase_admin TEMPLATE template0;' >/dev/null
          q template1 'CREATE DATABASE t034_rca9_clone OWNER supabase_admin TEMPLATE template0;' >/dev/null
          q t034_rca9_source 'CREATE SCHEMA private;
            CREATE TABLE private.rca9_one(id int);
            CREATE TABLE private.rca9_two(id int);
            CREATE TABLE private.rca9_three(id int);
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA private TO supabase_admin;
            ALTER TABLE private.rca9_one ENABLE ROW LEVEL SECURITY;
            ALTER TABLE private.rca9_two ENABLE ROW LEVEL SECURITY;
            ALTER TABLE private.rca9_three ENABLE ROW LEVEL SECURITY;' > /dev/null
          src="$(q t034_rca9_source "SELECT COUNT(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='private' AND c.relacl IS NOT NULL AND c.relacl=acldefault('r',c.relowner)")"
          [[ "$src" == 3 ]] || { echo 'T034_RCA9_EXPLICIT_DEFAULT_FIXTURE=HOLD'; exit 1; }
          docker exec -u postgres "$clone" pg_dump -U supabase_admin -Fc -d t034_rca9_source -f /tmp/t034-rca9-source.dump > "$temp/dump.log" 2>&1 ||
            { echo 'T034_RCA9_DUMP=HOLD'; exit 1; }
          docker exec -u postgres "$clone" pg_restore -U supabase_admin --exit-on-error \
            -d t034_rca9_clone /tmp/t034-rca9-source.dump > "$temp/restore.log" 2>&1 ||
            { echo 'T034_RCA9_RESTORE=HOLD'; exit 1; }
          clone_null="$(q t034_rca9_clone "SELECT COUNT(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='private' AND c.relacl IS NULL")"
          clone_default="$(q t034_rca9_clone "SELECT COUNT(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='private' AND c.relacl=acldefault('r',c.relowner)")"
          # A faithful restore might store explicit default ACLs; report fixed
          # safe summary before any permission canonicalization change.
          echo "T034_RCA9_FAKE_SOURCE_EXPLICIT_OWNER_DEFAULT=$src"
          echo "T034_RCA9_FAKE_CLONE_NULL_ACL=$clone_null"
          echo "T034_RCA9_FAKE_CLONE_EXPLICIT_OWNER_DEFAULT=$clone_default"
          [[ "$((clone_null+clone_default))" == 3 ]] ||
            { echo 'T034_RCA9_UNEXPECTED_RESTORED_ACL_FORM=HOLD'; exit 1; }
          echo 'T034_RCA9_REAL_PGDUMP_RESTORE_REPRESENTATION_REPRO=PASS'
          echo 'T034_RCA9_NO_REAL_DB_NO_B2_NO_AGE=PASS'
