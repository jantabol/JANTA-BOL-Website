name: B11 T071 E8 real B8 PG17 optional-module fault (PARTIAL E8)
on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/phase4/b11/t071-e8-b8-real-db-module-isolation.sql'
      - '.github/workflows/b11-t071-e8-real-pg17-b8-component-failure.yml'
permissions:
  contents: read
jobs:
  t071_real_b8_db_fault_isolated_only:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && github.event_name == 'pull_request' && github.head_ref == 'codex/b11-t071-failure-isolation-preflight-20261027' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: T071_DUMMY_LOCAL_PG_ONLY
          POSTGRES_USER: postgres
          POSTGRES_DB: jb_t071_e8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jb_t071_e8"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: T071_DUMMY_LOCAL_PG_ONLY
      PGDATABASE: jb_t071_e8
    steps:
      - name: Checkout PR inspection & fault script — no Git tokens persisted
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin actual B8 JANTA BOL source and SQL migrations, separate read-only fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 658f474d6ee0f24efac60f069979e8adee1e9221
          path: t071-real-b8-sql-fixture
          persist-credentials: false
      - name: Fail closed unless exact approved isolated source / runner and no prod credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "jantabol/JANTA-BOL-Website"
          test "$GITHUB_HEAD_REF" = "codex/b11-t071-failure-isolation-preflight-20261027"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$(git -C t071-real-b8-sql-fixture rev-parse HEAD)" = "658f474d6ee0f24efac60f069979e8adee1e9221"
          test "$PGDATABASE" = "jb_t071_e8"
          test "$PGHOST" = 127.0.0.1
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          test "$(psql -X -Atqc 'show server_version_num' | cut -c1-2)" = 17
          echo "T071_G4_POSTGRES17_ISOLATED_SERVER=VERIFIED"
      - name: Materialize real B8 G1 to G4 SQL migrations into only disposable PG17
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          d=t071-real-b8-sql-fixture
          n=0
          apply() { psql -X -v ON_ERROR_STOP=1 -q -f "$d/$1" >/dev/null; n=$((n+1)); }
          apply ci/phase4/b8-g1-disposable-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_case_reporter_scope_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_owner_mobile_case_picker_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_cp02_editor_immutable_review_REVIEW_ONLY.sql
          apply ci/phase4/b8-g2-cp01-cascade-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp01_provenance_survival_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp02_article_hold_GUARD_REVIEW_ONLY.sql
          apply ci/phase4/b8-g2-cp03-upload-session-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp03_private_upload_REVIEW_ONLY.sql
          apply ci/phase4/b8-g3-cp02-notification-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g3_cp02_founder_proof_notifications_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g3_cp03_manual_handoff_truth_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g3_cp04_reply_claim_REVIEW_ONLY.sql
          apply ci/phase4/b8-g4-public-article-status-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g4_cp01_cp03_public_projection_REVIEW_ONLY.sql
          test "$n" -eq 15
          echo "T071_G4_B8_ACTUAL_SCOPED_MIGRATIONS_APPLIED=15"
      - name: Actual B8 RPC failure, peer RPC health, independent original article/ads, rollback recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -f ci/phase4/b11/t071-e8-b8-real-db-module-isolation.sql
          echo 'T071_G4_REAL_PG17_B8_ONE_MODULE_INTEGRATED_FAILURE=CHECKED'
          echo 'T071_G4_REAL_ALL_13_MODULES_E8=NOT_COMPLETE'
          echo 'T071_G4_FINAL_PASS_LOCK=false'
