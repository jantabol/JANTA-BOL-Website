# PR-only, no production fault injection, no secrets, no release.
name: B11 T071 RPO-RTO and Failure Matrix PRE-FLIGHT (NO LIVE)
on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/phase4/b11/t071-failure-isolation-contract.mjs'
      - 'ci/phase4/b11/t071-failure-isolation-contract.test.mjs'
      - 'ci/phase4/b11/t071-vercel-production-git-source-observed-20261027.json'
      - 'ci/phase4/b11/t071-vercel-production-source-risk.test.mjs'
      - 'index.html'
      - 'script.js'
      - '.github/workflows/b11-t071-fault-matrix-preflight-NO-LIVE.yml'
      - 'JANTA_BOL_PHASE_4_WORKING/review/P4_T071_SOFT_LAUNCH_PRECODE_FAILURE_MATRIX_20261027.md'
permissions:
  contents: read
jobs:
  t071_preflight_no_live_injection:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'jantabol/JANTA-BOL-Website' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Pin checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Source contract and fail-closed recovery preflight (no live faults)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = jantabol/JANTA-BOL-Website
          test "$GITHUB_EVENT_NAME" = pull_request
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          node --check ci/phase4/b11/t071-failure-isolation-contract.mjs
          node --check ci/phase4/b11/t071-failure-isolation-contract.test.mjs
          node --check ci/phase4/b11/t071-vercel-production-source-risk.test.mjs
          node --test ci/phase4/b11/t071-failure-isolation-contract.test.mjs ci/phase4/b11/t070-final-e8-gate.test.mjs ci/phase4/b11/t071-vercel-production-source-risk.test.mjs
          echo 'T071_REAL_PRODUCT_CONTROLLED_FAULTS=NOT_RUN'
          echo 'T071_RPO_RTO_REAL_TARGETS=NOT_ESTABLISHED'
          echo 'T071_FAILURE_MATRIX_PRECODE_GATES=VERIFIED'
          echo 'T071_FINAL_PASS_LOCK=false'
          echo 'T070_FINAL_E8_STILL=HOLD'
          echo 'SOFT_LAUNCH_VERCEL_PRODUCTION_SOURCE_GIT_SHA=VERIFIED_READONLY'
          echo 'SOFT_LAUNCH_ACTUAL_HTTP_SITE_CONTENT=UNVERIFIED'
          echo 'SOFT_LAUNCH_EDITORIAL_STATIC_MOCK_RISK=HOLD'
