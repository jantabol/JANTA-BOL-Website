name: B11 T072 original case real PG17 partial write and retry duplicate finding (no production)
on:
  push:
    branches: [codex/b11-t072-partial-write-retry-idempotency-audit-20261028]
    paths:
      - 'ci/phase4/b11/t072-original-b8-case-retry-partial-write-real-pg17.sql'
      - '.github/workflows/b11-t072-original-case-real-pg17-idempotency-preflight.yml'
permissions:
  contents: read
jobs:
  original_b8_case_source_on_disposable_pg17_only:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && github.ref == 'refs/heads/codex/b11-t072-partial-write-retry-idempotency-audit-20261028' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: T072_DISPOSABLE_PG17_ONLY
          POSTGRES_USER: postgres
          POSTGRES_DB: jb_t072_retry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jb_t072_retry"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: T072_DISPOSABLE_PG17_ONLY
      PGDATABASE: jb_t072_retry
    steps:
      - name: Checkout test source no persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout original immutable B8 backend SQL source, also C1 actual deployed candidate tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 89849ba47f443f423d8bfe4f966bb2d38087201f
          path: original-b11-t072-pinned
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed on incorrect project/source and Production credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'jantabol/JANTA-BOL-Website'
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = jb_t072_retry
          test "$(git -C original-b11-t072-pinned rev-parse HEAD)" = 89849ba47f443f423d8bfe4f966bb2d38087201f
          git -C original-b11-t072-pinned diff --exit-code 659bcdc2ec4e270ea066863b4b456aeb65cb7c73 HEAD -- JANTA_BOL_PHASE_3C_WORKING
          git -C original-b11-t072-pinned diff --exit-code 658f474d6ee0f24efac60f069979e8adee1e9221 HEAD -- ci/phase4/b8-g1-disposable-fixture.sql JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_case_reporter_scope_REVIEW_ONLY.sql
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num' | cut -c1-2)" = 17
          echo 'T072_EXACT_ORIGINAL_B8_SQL_AND_DEPLOYED_C1_SHA_PIN=PASS'
      - name: Apply original unmodified B8 Founder owner case SQL into real isolated PG17
        shell: bash
        run: |
          set -Eeuo pipefail
          d=original-b11-t072-pinned
          psql -X -q -v ON_ERROR_STOP=1 -f "$d/ci/phase4/b8-g1-disposable-fixture.sql"
          psql -X -q -v ON_ERROR_STOP=1 -f "$d/JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_case_reporter_scope_REVIEW_ONLY.sql"
          echo 'T072_ORIGINAL_B8_CASE_RPC_ACTUALLY_LOADED_ON_DISPOSABLE_PG17=PASS'
      - name: Actual initial commit, ambiguous ack retry, partial write, security denial and grant idempotency
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -f ci/phase4/b11/t072-original-b8-case-retry-partial-write-real-pg17.sql
          echo 'T072_FAILED_WRITE_AND_PRIVATE_AUTH_CHECKS=PASS_SCOPED'
          echo 'T072_DUPLICATE_OWNER_CASE_ON_SAME_REQUEST=OPEN_P2_NOT_A_PASS'
          echo 'T072_CONNECTED_HOSTED_IDEMPOTENCY_E2=NOT_PROVEN'
          echo 'T072_FINAL_PASS_LOCK=false'
          echo 'T071_FINAL_PASS_LOCK=false'
          echo 'T075_B11_FINAL_PASS_LOCK=false'
