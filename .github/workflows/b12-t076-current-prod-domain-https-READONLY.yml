name: B12 T076 current Production HTTPS vs exact candidate (READONLY, NO LIVE DEPLOY)
on:
  push:
    branches: [codex/b12-b0-b12-reconcile-20261028]
    paths:
      - '.github/workflows/b12-t076-current-prod-domain-https-READONLY.yml'
      - 'ci/phase4/b12/t076-current-prod-vs-candidate-public-https.test.mjs'
      - 'JANTA_BOL_PHASE_3C_WORKING/index.html'
      - 'JANTA_BOL_PHASE_3C_WORKING/website-v3.js'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_public_baseline_no_secrets:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && github.ref == 'refs/heads/codex/b12-b0-b12-reconcile-20261028' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Guard no Production/Auth/B2/Cricket credentials or remote-changing actions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'jantabol/JANTA-BOL-Website'
          test "$GITHUB_REF" = 'refs/heads/codex/b12-b0-b12-reconcile-20261028'
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${CRICKET_DATABASE_URL:-}"
          node --check ci/phase4/b12/t076-current-prod-vs-candidate-public-https.test.mjs
      - name: Real Vercel TLS HTTPS GET original root and V3 paths, exact candidate comparison
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test ci/phase4/b12/t076-current-prod-vs-candidate-public-https.test.mjs
          echo 'T076_PROD_OLD_MAIN_HTTPS_SCOPED_CHECK=COMPLETED'
          echo 'T076_EXACT_B12_CANDIDATE_PRODUCTION_DEPLOY=NOT_PERFORMED'
          echo 'T076_FINAL_PASS_LOCK=false'
