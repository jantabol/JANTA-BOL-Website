name: B11 T073 original B8 PG17 corruption deletion revoke and DDL rollback no production
on:
  push:
    branches: [codex/b11-t073-corruption-rollback-component-20261028]
    paths:
      - 'ci/phase4/b11/t073-original-b8-corruption-delete-security-migration-rollback-pg17.sql'
      - '.github/workflows/b11-t073-real-pg17-original-case-rollback-negative.yml'
permissions:
  contents: read
jobs:
  authentic_original_b8_disposable_sql_negative_incident:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && github.ref == 'refs/heads/codex/b11-t073-corruption-rollback-component-20261028' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: T073_DISPOSABLE_ONLY
          POSTGRES_USER: postgres
          POSTGRES_DB: jb_t073_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jb_t073_security"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: T073_DISPOSABLE_ONLY
      PGDATABASE: jb_t073_security
    steps:
      - name: Checkout review-only scripts without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout exact real released C1 app and original B8 SQL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 89849ba47f443f423d8bfe4f966bb2d38087201f
          path: t073-original
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse real Production DB or incorrect JANTA BOL source/host
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'jantabol/JANTA-BOL-Website'
          test "$PGDATABASE" = jb_t073_security
          test "$PGHOST" = 127.0.0.1
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${VERCEL_TOKEN:-}"
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num' | cut -c1-2)" = 17
          test "$(git -C t073-original rev-parse HEAD)" = '89849ba47f443f423d8bfe4f966bb2d38087201f'
          git -C t073-original diff --exit-code 659bcdc2ec4e270ea066863b4b456aeb65cb7c73 HEAD -- JANTA_BOL_PHASE_3C_WORKING
          git -C t073-original diff --exit-code 658f474d6ee0f24efac60f069979e8adee1e9221 HEAD -- ci/phase4/b8-g1-disposable-fixture.sql JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_case_reporter_scope_REVIEW_ONLY.sql
          echo 'T073_PINNED_REAL_C1_APP_AND_ORIGINAL_B8_SQL_NO_PROD_SECRETS=PASS'
      - name: Load actual original B8 no edits to existing code or SQL
        shell: bash
        run: |
          set -Eeuo pipefail
          d=t073-original
          psql -X -q -v ON_ERROR_STOP=1 -f "$d/ci/phase4/b8-g1-disposable-fixture.sql"
          psql -X -q -v ON_ERROR_STOP=1 -f "$d/JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_case_reporter_scope_REVIEW_ONLY.sql"
          echo 'T073_ORIGINAL_FOUNDER_CASE_FUNCTIONS_AND_FK_DB_PG17=PASS'
      - name: Actual SQL corruption linked delete revoked RPC recovery and migration rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -f ci/phase4/b11/t073-original-b8-corruption-delete-security-migration-rollback-pg17.sql
          echo 'T073_GENUINE_LOCAL_DB_INCIDENT_AND_ROLLBACK=PASS_COMPONENT'
          echo 'T073_SECRET_COMPROMISE_ROTATION_VERCEL_FAILED_DEPLOYMENT=NOT_PERFORMED'
          echo 'T073_FULL_E1_E5_E7_E8=HOLD'
          echo 'T071_FINAL_PASS_LOCK=false'
          echo 'T073_FINAL_PASS_LOCK=false'
          echo 'T075_B11_FINAL_PASS_LOCK=false'
