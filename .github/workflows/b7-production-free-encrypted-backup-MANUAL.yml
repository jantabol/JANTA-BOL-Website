# REVIEW ONLY — manual backup storage + owner offline encryption key not yet provisioned.
# Must be reviewed and copied to a protected default branch AFTER owner storage selection.
# Public GitHub repository: NEVER upload DB dump, plaintext or ciphertext as artifact.
name: JANTA BOL FREE encrypted offsite DB backup (manual only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type JANTA_BOL_BACKUP_ONLY to start a read-only offsite export
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: janta-bol-free-backup
  cancel-in-progress: false
jobs:
  backup:
    if: ${{ github.event.inputs.confirmation == 'JANTA_BOL_BACKUP_ONLY' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: janta-bol-production-backup
    timeout-minutes: 45
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      JB_BACKUP_AGE_RECIPIENT: ${{ secrets.JB_BACKUP_AGE_RECIPIENT }}
      JB_BACKUP_RCLONE_CONFIG_B64: ${{ secrets.JB_BACKUP_RCLONE_CONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify remote and encryption are configured before connecting to DB
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing production DB password"; exit 1; }
          test -n "$JB_BACKUP_AGE_RECIPIENT" || { echo "::error::Missing OWNER public age recipient"; exit 1; }
          test -n "$JB_BACKUP_RCLONE_CONFIG_B64" || { echo "::error::Missing owner-controlled private offsite rclone config"; exit 1; }
          echo "Preflight present. No data was exported before this point."
      - name: Install backup and transfer clients (runner ephemeral)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age rclone zstd postgresql-client-17
      - name: Supabase CLI (official setup action)
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Create, AGE encrypt and upload — NEVER Github artifact
        shell: bash
        run: bash ci/backup/jb-free-offsite-backup.sh
