name: P4-T037 CP02 immutable custom quote + contact-only protected CI
on:
  push:
    branches:
      - review/t037-packages-rotation-inventory-20261016
permissions:
  contents: read
jobs:
  owner-quote-real-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: ci_only, POSTGRES_DB: jb_t037_cp02}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d jb_t037_cp02"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env: {PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: ci_only, PGDATABASE: jb_t037_cp02}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Exact synthetic existing financial schema (no hosted/production)
        run: |
          psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b7-payment-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f JANTA_BOL_PHASE_4_WORKING/db/20261010_b7_manual_payment_REVIEW_ONLY.sql
      - name: Actual Owner custom no-package quote approved freeze with audit and rollback
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b7-t037-cp02-quote-immutable-regression.sql
  unchanged-news-public-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: No remote service credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(printenv SUPABASE_ACCESS_TOKEN || true)"
          test -z "$(printenv SUPABASE_SERVICE_ROLE_KEY || true)"
          test -z "$(printenv SUPABASE_DB_PASSWORD || true)"
          echo 'T037_CP02_PUBLIC_CONTACT_ONLY_NO_PAID_AD_NO_LIVE_WRITES'
      - name: Original positive package/advertiser enquiry, Founder ad form and public safety tests
        run: |
          node --test ci/phase4/b7-t037-cp01-source-price.test.cjs
          node --test ci/phase4/b7-cp03-intake-inventory-feed.test.cjs
          node --test ci/phase4/b7-client-regression.cjs
          node ci/phase4/b7-closure-gate.cjs --audit
