name: T080 Geography Published C1 Regression (Review Only)
on:
  push:
    branches:
      - codex/t080-geo-coverage-published-c1-20261031
    paths:
      - 'JANTA_BOL_PHASE_3C_WORKING/script.js'
      - 'ci/phase4/b12/t080-geo-coverage-public-c1.test.mjs'
      - '.github/workflows/b12-t080-geo-public-review.yml'
  pull_request:
    branches:
      - codex/t079-health-safe-error-diagnostic-20261029
    paths:
      - 'JANTA_BOL_PHASE_3C_WORKING/script.js'
      - 'ci/phase4/b12/t080-geo-coverage-public-c1.test.mjs'
      - '.github/workflows/b12-t080-geo-public-review.yml'
permissions:
  contents: read
concurrency:
  group: jb-t080-public-only-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  geography-public-c1:
    name: T080 Anonymous Geography + Founder No-Loss (Offline)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Syntax and C1 geographic regression
        run: |
          node --check JANTA_BOL_PHASE_3C_WORKING/script.js
          node --check JANTA_BOL_PHASE_3C_WORKING/public-c1-projection.js
          node --test ci/phase4/b12/t080-geo-coverage-public-c1.test.mjs
          node --test ci/phase4/b12/v3-c1-public-integration.test.cjs ci/phase4/b12/founder-auth-readonly-regression.test.cjs
