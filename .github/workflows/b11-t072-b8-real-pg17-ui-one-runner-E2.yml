name: B11 T072 single-run original B8 UI and protected Server PG17 integrated component E2 (NO PROD)
on:
  push:
    branches: [codex/b11-t072-b8-owner-ui-integration-review-20261028]
    paths:
      - '.github/workflows/b11-t072-b8-real-pg17-ui-one-runner-E2.yml'
      - 'JANTA_BOL_PHASE_3C_WORKING/b8-accountability-client.js'
      - 'JANTA_BOL_PHASE_3C_WORKING/b8-accountability-ui.js'
      - 'JANTA_BOL_PHASE_3C_WORKING/b8-accountability.html'
      - 'JANTA_BOL_PHASE_3C_WORKING/b8-owner-idempotency-client.js'
permissions:
  contents: read
jobs:
  same_runner_original_b8_browser_and_protected_sql_candidate:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && github.ref == 'refs/heads/codex/b11-t072-b8-owner-ui-integration-review-20261028' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: T072_DISPOSABLE_NO_REAL_SECRETS
          POSTGRES_USER: postgres
          POSTGRES_DB: jb_t072_idempotent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jb_t072_idempotent"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 25
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: T072_DISPOSABLE_NO_REAL_SECRETS
      PGDATABASE: jb_t072_idempotent
    steps:
      - name: Checkout actual B8 UI integration source (read only, no credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout old already-tested protected SQL proposal by immutable SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 38ca825d8c32bdc33ddd8122aa871cafd645aba4
          path: protected-backend-proposal
          persist-credentials: false
          fetch-depth: 0
      - name: Strict source and disposable PG17 guards
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'jantabol/JANTA-BOL-Website'
          test "$GITHUB_REF" = 'refs/heads/codex/b11-t072-b8-owner-ui-integration-review-20261028'
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = jb_t072_idempotent
          test "$(git -C protected-backend-proposal rev-parse HEAD)" = 38ca825d8c32bdc33ddd8122aa871cafd645aba4
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num' | cut -c1-2)" = 17
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${CRICKET_DATABASE_URL:-}"
          echo 'T072_ORIGINAL_B8_UI_SQL_ONE_RUNNER_SAFE_SCOPE=PASS'
      - name: Load real original B8 SQL plus existing additive private idempotency proposal in disposable PG17
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -f ci/phase4/b8-g1-disposable-fixture.sql
          psql -X -q -v ON_ERROR_STOP=1 -f JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_case_reporter_scope_REVIEW_ONLY.sql
          psql -X -q -v ON_ERROR_STOP=1 -f protected-backend-proposal/JANTA_BOL_PHASE_4_WORKING/db/20261028_t072_b8_case_idempotency_PROPOSAL_REVIEW_ONLY.sql
          echo 'T072_ORIGINAL_B8_ADD_ONLY_RPC_LEDGER_PG17=LOADED_DISPOSABLE_ONLY'
      - name: Execute actual PG17 case commit/unknown retry/partial write/auth/ledger negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -f protected-backend-proposal/ci/phase4/b11/t072-original-b8-case-idempotent-minimum-fix-pg17.sql
          echo 'T072_ORIGINAL_BACKEND_ACTUAL_PG17_IDEMPOTENT_RPC=PASS_SCOPED'
      - name: On SAME runner independently execute integrated Android client and original B8 old regression
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test             ci/phase4/b11/t072-original-b8-owner-ui-durable-client.test.mjs             ci/phase4/b11/t072-b8-owner-app-optin-integration.test.mjs             ci/phase4/b8-g3-cp01-android-workflow.test.mjs             ci/phase4/b8-g1-mobile-case-picker.test.mjs             ci/phase4/b8-mobile-focused-workflow.test.mjs             ci/phase4/b8-g3-cp02-cp03-android-contract.test.mjs             ci/phase4/b8-g4-public-projection-contract.test.mjs             ci/phase4/b8-g4-cp04-public-browser-lifecycle.test.mjs
          echo 'T072_SINGLE_RUN_BACKEND_AND_ANDROID_SOURCE_SCOPED_E2=PASS'
          echo 'T072_REAL_HOSTED_SUPABASE_AUTH_E5=NOT_TESTED'
          echo 'T072_REAL_ANDROID_PHONE_E2=NOT_TESTED'
          echo 'T072_PRODUCTION_DEPLOYED=false'
          echo 'T072_FINAL_PASS_LOCK=false'
          echo 'T075_FULL_E8=HOLD'
