# Original P4-T090 quality gate — START, NOT full release signoff
name: P4 T090 RUN15 E1 E5 E7 E8 Failure Repair DUE Readiness - Protected
on:
  push:
    branches: [codex/b13-t090-failure-readiness-audit-20261103]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t090-official-due-${{ github.ref }}
  cancel-in-progress: true
jobs:
  t090_original_register_and_fail_repair:
    name: T090 canonical 109 states + P1 RCA exact evidence + source-only E7 negative
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Full exact original E1 E7 failure/repair and NOT RUN status protection
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test ci/phase4/b13-t090-original-failure-readiness-e1-e5-e7-e8-20261103.test.mjs
          node --test ci/phase4/b13-t090-live-anon-private-access-denial.test.mjs
          node --test ci/phase4/b13-t090-e8-real-backup-independent-history-and-current-live-counts.test.mjs
          node --test ci/phase4/b13-t090-production-source-e7-18-file-parity-20261103.test.mjs
          node --test ci/phase4/b13-t090-all64-live-deployment-git-byte-parity-20261103.test.mjs
          node --test ci/phase4/b13-t090-live-edge15-source-and-5-no-jwt-negative-20261103.test.mjs
          node --test ci/phase4/b13-t090-live-edge10-jwt-required-no-auth-denials-20261103.test.mjs
          node --test ci/phase4/b13-t090-live-edge10-forged-bearer-negatives-20261103.test.mjs
          node --test ci/phase4/b13-t090-synthetic-role-rls-no-publish-leak-20261103.test.mjs
          node --test ci/phase4/b13-t090-existing-identity-session-rls-sql-scoped-20261103.test.mjs
          node --test ci/phase4/b13-t090-live-http-forged-owner-reporter-postgrest-gotrue-negative-20261103.test.mjs
          node --test ci/phase4/b13-t090-e8-live-runtime-backup-no-false-recovery.test.mjs
          node --test ci/phase4/b13-t089-e7-official-records-coverage.test.mjs
          node --test ci/phase4/b13-t089-original-master-section-checkpoint-crosswalk.test.mjs
          node --test ci/phase4/b13-t089-live-module-entrypoints-authority.test.mjs
          node --test ci/phase4/b13-t089-cross-engine-static-owners-20261103.test.mjs
          node --test ci/phase4/b13-t089-recovery-archive-integrity.test.mjs
          node --test ci/phase4/b13-t087-cross-module-security-negative-map.test.mjs
      - name: Original protected News Auth Recovery Failure-Isolation regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          node ci/phase3-regression/static-p3-security-regression.cjs
          node ci/phase3-regression/static-p3-recovery-regression.cjs
          node ci/phase3-regression/static-p3-incident-regression.cjs
          node --test ci/phase4/b11/t070-real-joint-manual-safety.test.mjs
          node --test ci/phase4/b11/t071-c2-all-13-scoped-fault-proof-contract.test.mjs
          echo 'T090_PROTECTED_PREVIOUS_LOCKED_GATES=PASS_SCOPED'
      - name: Build verified immutable production 64-file static QA ZIP (not full recovery)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ci/phase4/b13-t090-build-verified-prod64-static-archive-20261103.py
          python3 -m zipfile -t t090-janta-bol-prod-static64-NOT-FULL-RESTORE.zip
          sha256sum -c t090-janta-bol-prod-static64-NOT-FULL-RESTORE.zip.sha256
      - name: Publish scoped static QA ZIP to run artifacts (not final ZIP)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t090-prod64-static-qa-NOT-FULL-RESTORE
          path: |
            t090-janta-bol-prod-static64-NOT-FULL-RESTORE.zip
            t090-janta-bol-prod-static64-NOT-FULL-RESTORE.zip.sha256
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Explicit E5/E8 and full final authority HOLD, no service account/payment/deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${VERCEL_TOKEN:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          echo 'T090_REAL_SIGNED_E5=HOLD'
          echo 'T090_REAL_INDEPENDENT_E8=HOLD'
          echo 'T090_ORIGINAL_FINAL_PASS_LOCK=HOLD'

  t090_stale_session_pg17_disposable:
    name: T090 security P2 negative reproducer and safe minimal policy repair (synthetic PG17 only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ephemeral-fixture-only-not-production
          POSTGRES_USER: postgres
          POSTGRES_DB: t090_ephemeral_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d t090_ephemeral_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Real isolated PostgreSQL 17 old-policy failure, exact minimum repair, Owner/Admin/Reporter positive + revoked negatives
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: t090_ephemeral_fixture
          PGPASSWORD: ephemeral-fixture-only-not-production
        run: |
          set -Eeuo pipefail
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          psql -X -A -t -c "SHOW server_version_num" | grep -E '^17[0-9]{4}$'
          psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b13-t090-stale-session-rls-pg17-disposable-20261103.sql
          echo "T090_PROD_DB_AUTH_SESSIONS_MIGRATION=NOT_APPLIED"
          echo "T090_REAL_SIGNED_E5_FULL_E8=HOLD"
