name: B12 T076 EXACT Hobby PR61 preview LIVE READONLY (NO DEPLOY)
on:
  push:
    branches: [codex/b12-b0-b12-reconcile-20261028]
    paths:
      - '.github/workflows/b12-t076-exact-hobby-preview-readonly.yml'
      - 'ci/phase4/b12/t076-exact-hobby-preview-http-readonly.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public_preview_check_only:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && github.ref == 'refs/heads/codex/b12-b0-b12-reconcile-20261028' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Immutable requested Hobby preview and no live credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'jantabol/JANTA-BOL-Website'
          test "$GITHUB_REF" = 'refs/heads/codex/b12-b0-b12-reconcile-20261028'
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${CRICKET_DATABASE_URL:-}"
          node --check ci/phase4/b12/t076-exact-hobby-preview-http-readonly.test.mjs
      - name: 4 actual public HTTPS GETs of exact preview (401/403 stays HOLD)
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test ci/phase4/b12/t076-exact-hobby-preview-http-readonly.test.mjs
          echo 'T076_PR61_EXACT_PREVIEW_HTTPS_SMOKE=PASS_SCOPED'
          echo 'T076_FOUNDER_LOGIN_AND_RELEASE=NOT_TESTED'
          echo 'T076_FINAL_PASS_LOCK=false'
