name: T080 Durable Article Create Intent Review (NO LIVE WRITE)
on:
  push:
    branches: [codex/t080-durable-article-intent-guard-20261031]
    paths:
      - 'JANTA_BOL_PHASE_3C_WORKING/add-news.html'
      - 'JANTA_BOL_PHASE_3C_WORKING/backend-client.js'
      - 'ci/phase4/b12/t080-durable-article-intent.test.mjs'
      - '.github/workflows/b12-t080-durable-create-review.yml'
  pull_request:
    branches: [codex/t080-admin-ack-failclosed-review-20261031]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t080-durable-article-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-real-source:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && (github.ref == 'refs/heads/codex/t080-durable-article-intent-guard-20261031' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact new-branch and no secrets gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/t080-durable-article-intent-guard-20261031' || test "$GITHUB_EVENT_NAME" = 'pull_request'
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          test -z "${CRICKET_DATABASE_URL:-}"
          node --check JANTA_BOL_PHASE_3C_WORKING/backend-client.js
      - name: Real backend-client VM PK identity / reload / two tabs / lost ACK
        run: node --test ci/phase4/b12/t080-durable-article-intent.test.mjs
      - name: Original T080 UI, Founder AAL2 and Publisher fault regressions
        run: |
          node --test ci/phase4/b12/t080-admin-ack-failclosed.test.mjs
          node --test ci/phase4/b12/founder-auth-readonly-regression.test.cjs
          node ci/phase4/p4-t019-publishing-fault-injection.cjs
      - name: Release scope and protected zero-diff files
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --exit-code 93df12aa8ffdfae38d9a4066b6a4556bb36969e5 HEAD --             JANTA_BOL_PHASE_3C_WORKING/admin-auth.js             JANTA_BOL_PHASE_3C_WORKING/admin-login.html             JANTA_BOL_PHASE_3C_WORKING/admin.html             JANTA_BOL_PHASE_3C_WORKING/article.html             JANTA_BOL_PHASE_3C_WORKING/public-c1-projection.js             JANTA_BOL_PHASE_3C_WORKING/website-v3.js             JANTA_BOL_PHASE_3C_WORKING/script.js             JANTA_BOL_PHASE_3C_WORKING/phase3c-live-engine-admin.js             vercel.json
          git diff --name-only 93df12aa8ffdfae38d9a4066b6a4556bb36969e5 HEAD | while IFS= read -r file; do
            case "$file" in
              JANTA_BOL_PHASE_3C_WORKING/backend-client.js|JANTA_BOL_PHASE_3C_WORKING/add-news.html|ci/phase4/b12/t080-durable-article-intent.test.mjs|.github/workflows/b12-t080-durable-create-review.yml) ;;
              *) echo "OUT_OF_SCOPE_FILE=$file"; exit 1;;
            esac
          done
          echo 'T080_DURABLE_REVIEW_ONLY=true'
          echo 'T080_PRODUCTION_MUTATION=NONE'
          echo 'T080_REAL_ANDROID_E3_E5=NOT_RUN'
          echo 'T080_ALL_CRITICAL_ACTIONS_DURABILITY=NOT_CLAIMED'
