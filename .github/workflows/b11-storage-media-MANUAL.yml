# Safe narrow review PR only. Never automatic LIVE read or storage write.
name: JANTA BOL T069 Original Storage Media AGE B2 (Founder manual only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type JANTA_BOL_MEDIA_EXPORT_ONLY
        required: true
        type: string
      reviewed_sha:
        description: Exact current reviewed protected-main commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: janta-bol-media-encrypted-manual
  cancel-in-progress: false
jobs:
  original_media_only:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && github.actor == 'jantabol' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.inputs.confirmation == 'JANTA_BOL_MEDIA_EXPORT_ONLY' && github.event.inputs.reviewed_sha == github.sha }}
    environment: janta-bol-production-backup
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      B11_MEDIA_EXPORT_CONFIRMATION: JANTA_BOL_MEDIA_EXPORT_ONLY
      B11_FOUNDER_APPROVED_MEDIA_OFFSITE: JANTA_BOL_MEDIA_EXPORT_ONLY
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check protected exact manual context without production secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = jantabol/JANTA-BOL-Website
          test "$GITHUB_ACTOR" = jantabol
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$B11_MEDIA_EXPORT_CONFIRMATION" = JANTA_BOL_MEDIA_EXPORT_ONLY
          bash -n ci/phase4/b11/storage-media-encrypted-b2-MANUAL.sh
          node --test ci/phase4/b11/storage-readonly-export.test.mjs
          node --test ci/phase4/b11/storage-media-manual-safety.test.mjs
      - name: Install approved temporary AGE/B2 tools WITHOUT production secrets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age zstd rclone >/dev/null
      - name: Read original 3 buckets and verify real B2 ciphertext offline restored file hashes
        shell: bash
        env:
          JB_B11_SERVICE_ROLE_KEY: ${{ secrets.JB_B11_SERVICE_ROLE_KEY }}
          JB_BACKUP_AGE_RECIPIENT: ${{ secrets.JB_BACKUP_AGE_RECIPIENT }}
          JB_BACKUP_B2_KEY_ID: ${{ secrets.JB_BACKUP_B2_KEY_ID }}
          JB_BACKUP_B2_APPLICATION_KEY: ${{ secrets.JB_BACKUP_B2_APPLICATION_KEY }}
          JB_BACKUP_REMOTE_PREFIX: ${{ secrets.JB_BACKUP_REMOTE_PREFIX }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$JB_B11_SERVICE_ROLE_KEY"
          test -n "$JB_BACKUP_AGE_RECIPIENT"
          test -n "$JB_BACKUP_B2_KEY_ID"
          test -n "$JB_BACKUP_B2_APPLICATION_KEY"
          test -n "$JB_BACKUP_REMOTE_PREFIX"
          d="$(mktemp -d)"
          trap 'rm -rf -- "$d"' EXIT
          mkdir -m 700 "$d/source"
          node ci/phase4/b11/storage-media-manual-cli.mjs export-manual --root "$d/source" > "$d/private-export.json"
          bash ci/phase4/b11/storage-media-encrypted-b2-MANUAL.sh "$d/source"
          echo 'T069_SOURCE_ONLY=YES; NO_LIVE_MODIFICATION_OR_GITHUB_MEDIA_ARTIFACT'
