name: B7 T034 isolated security review — NO PRODUCTION WRITES
on:
  push:
    branches:
      - codex/b7-t034-safe-guard-20261013
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b7-t034-payment-guard:
    name: ADS-008 RED reproduction then guarded BOTH legacy RPCs + direct state
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: b7_t034_guard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d b7_t034_guard"
          --health-interval 5s
          --health-timeout 5s
          --retries 8
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_local_only
      PGDATABASE: b7_t034_guard
    steps:
      - uses: actions/checkout@v4
      - name: Baseline fixture — exact previously observed OLD payment RPCs
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b7-t034-payment-guard-fixture.sql
      - name: RED — demonstrate old historical high-risk pending path accepted on DISPOSABLE PG, then ROLLBACK
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          DO $proof$
          DECLARE old_payment_id uuid;
          BEGIN
            PERFORM set_config('b7.test_owner','enabled',true);
            SELECT public.jb_ad_confirm_payment_internal(
              '20000000-0000-4000-8000-000000000001',
              'FAKE-RED-HISTORICAL-PENDING',50000) INTO old_payment_id;
            IF old_payment_id IS NULL THEN RAISE EXCEPTION 'OLD_ROUTE_NOT_REPRODUCED'; END IF;
            IF NOT EXISTS(SELECT 1 FROM public.ad_campaigns
              WHERE id='20000000-0000-4000-8000-000000000001'
                AND status='paid' AND paid_at IS NOT NULL)
            THEN RAISE EXCEPTION 'OLD_ROUTE_NOT_REPRODUCED'; END IF;
            RAISE NOTICE 'RED REPRODUCED: legacy HIGH-risk pending was incorrectly marked paid (only in rolled-back fixture)';
          END $proof$;
          ROLLBACK;
          SQL
      - name: Apply ADDITIVE payment guard in isolated database ONLY
        run: psql -X -v ON_ERROR_STOP=1 -f JANTA_BOL_PHASE_4_WORKING/db/20261013_b7_t034_payment_verification_GUARD_REVIEW_ONLY.sql
      - name: ADS-008 — HIGH pending both RPC negatives, direct DML, Owner AAL2, verified normal/high positives
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b7-t034-payment-guard-regression.sql
      - name: Existing role functions unchanged, no public EXECUTE on guard
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $acl$
          BEGIN
           IF has_function_privilege('anon','private.b7_t034_assert_advertiser_verified(uuid)','EXECUTE') OR
              has_function_privilege('authenticated','private.b7_t034_assert_advertiser_verified(uuid)','EXECUTE')
           THEN RAISE EXCEPTION 'NEW_PRIVATE_GUARD_EXPOSED'; END IF;
           IF NOT has_function_privilege('authenticated',
                 'public.jb_ad_confirm_payment_internal(uuid,text,bigint)','EXECUTE')
           OR NOT has_function_privilege('authenticated',
                 'public.jb_ad_record_payment_internal(uuid,text,text,bigint,text,boolean)','EXECUTE')
           THEN RAISE EXCEPTION 'OLD_OWNER_RPC_ACL_BROKEN';END IF;
           RAISE NOTICE 'PASS: no new public capability, old authorized function signatures retained';
          END $acl$;
          SQL
  b7-t034-existing-enquiry:
    name: ADS-002/003/004/005/007/009 existing independent enquiry and old overload regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: b7_t034_enquiry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d b7_t034_enquiry"
          --health-interval 5s
          --health-timeout 5s
          --retries 8
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_local_only
      PGDATABASE: b7_t034_enquiry
    steps:
      - uses: actions/checkout@v4
      - name: Existing canonical synthetic enquiry fixture
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b7-enquiry-fixture.sql
      - name: Existing old 5/6/7 arg signatures fixture
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b7-t034-live-legacy-fixture.sql
      - name: Current reviewed enquiry code (fixture only, not deployed by workflow)
        run: psql -X -v ON_ERROR_STOP=1 -f JANTA_BOL_PHASE_4_WORKING/db/20261010_b7_public_enquiry_review.sql
      - name: Existing invalid WhatsApp, forged origin, rate cooldown, verification matrix
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b7-enquiry-regression.sql
      - name: Existing all legacy overloads no anonymous/nonowner bypass
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b7-t034-live-legacy-regression.sql
