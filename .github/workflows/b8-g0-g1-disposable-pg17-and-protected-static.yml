      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_b8_fixture_only
          POSTGRES_DB: jb_b8_g1
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d jb_b8_g1"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local_b8_fixture_only
      PGDATABASE: jb_b8_g1
