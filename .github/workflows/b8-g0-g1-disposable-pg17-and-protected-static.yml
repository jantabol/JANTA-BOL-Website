name: B8 G0/G1 Case Reporter Scope / No-Prod PG17 + Protected News CI
on:
  push:
    branches:
      - codex/b8-g0-g1-accountability-20261017
    paths:
      - '.github/workflows/b8-g0-g1-disposable-pg17-and-protected-static.yml'
      - 'JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_case_reporter_scope_REVIEW_ONLY.sql'
      - 'ci/phase4/b8-g1-disposable-fixture.sql'
      - 'ci/phase4/b8-g1-real-postgres-regression.sql'
      - 'JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_cp02_editor_immutable_review_REVIEW_ONLY.sql'
      - 'ci/phase4/b8-g1-cp02-editor-review-regression.sql'
      - 'JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp01_provenance_survival_REVIEW_ONLY.sql'
      - 'ci/phase4/b8-g2-cp01-cascade-fixture.sql'
      - 'ci/phase4/b8-g2-cp01-provenance-regression.sql'
      - 'JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp02_article_hold_GUARD_REVIEW_ONLY.sql'
      - 'ci/phase4/b8-g2-cp02-legal-hold-regression.sql'
      - 'JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp03_private_upload_REVIEW_ONLY.sql'
      - 'ci/phase4/b8-g2-cp03-upload-session-fixture.sql'
      - 'ci/phase4/b8-g2-cp03-private-upload-scope-regression.sql'
      - 'CODEX_CURRENT_SUPABASE/functions/_shared/b8-private-evidence-gateway.mjs'
      - 'CODEX_CURRENT_SUPABASE/functions/jb-b8-private-evidence/index.ts'
      - 'ci/phase4/b8-g2-cp03-private-upload-gateway.test.mjs'
      - 'ci/phase4/b8-g2-cp02-race-isolated-pg17.sh'
      - 'JANTA_BOL_PHASE_3C_WORKING/b8-accountability.html'
      - 'JANTA_BOL_PHASE_3C_WORKING/b8-accountability-client.mjs'
      - 'JANTA_BOL_PHASE_3C_WORKING/b8-accountability-ui.mjs'
      - 'ci/phase4/b8-g3-cp01-android-workflow.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b8-g1-disposable-postgres:
    name: G1 Actual PG17 scope/ACL/Owner/Reporter failures and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_b8_fixture_only
          POSTGRES_DB: jb_b8_g1
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d jb_b8_g1"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local_b8_fixture_only
      PGDATABASE: jb_b8_g1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Explicit public-safety guard, no connected database secrets
        run: |
          set -euo pipefail
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          echo 'B8 G1 isolated local postgres ONLY — never LIVE Supabase or production auth'
      - name: Build synthetic B1 roles + Owner + normal Article and B7 sentinels
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b8-g1-disposable-fixture.sql
      - name: Apply G1 scoped review-only migration into disposable PostgreSQL17
        run: psql -X -v ON_ERROR_STOP=1 -f JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_case_reporter_scope_REVIEW_ONLY.sql
      - name: REAL PostgreSQL G1 role/ACL/revoke/expiry/session/rollback negative tests
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b8-g1-real-postgres-regression.sql
      - name: Apply G1 CP02 Editor/immutable review migration into the SAME disposable PG17
        run: psql -X -v ON_ERROR_STOP=1 -f JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_cp02_editor_immutable_review_REVIEW_ONLY.sql
      - name: Real Editor R1/R2 negative/immutable/Founder EVIDENCE_GAP review & rollback
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b8-g1-cp02-editor-review-regression.sql
      - name: Prepare synthetic original Article/source/version/verification FK CASCADE metadata
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b8-g2-cp01-cascade-fixture.sql
      - name: Apply B8 G2 CP01 independent provenance + unverified evidence claims to disposable PG17
        run: psql -X -v ON_ERROR_STOP=1 -f JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp01_provenance_survival_REVIEW_ONLY.sql
      - name: Verify owner/reporter privacy, unverified SHA receipts, immutable links and ROLLBACK
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b8-g2-cp01-provenance-regression.sql
      - name: Apply G2 CP02 linked Article hard-delete guard and append-only hold to disposable PG17
        run: psql -X -v ON_ERROR_STOP=1 -f JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp02_article_hold_GUARD_REVIEW_ONLY.sql
      - name: Real PG17 linked hard-delete rejection, original sources survive, ROLLBACK
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b8-g2-cp02-legal-hold-regression.sql
      - name: Init synthetic actor JWT+session tables for scoped private upload CI
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b8-g2-cp03-upload-session-fixture.sql
      - name: Apply G2 CP03 bounded private upload intent and server-only receipts
        run: psql -X -v ON_ERROR_STOP=1 -f JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp03_private_upload_REVIEW_ONLY.sql
      - name: REAL PostgreSQL17 private upload RPC/quota/session/replay/actor and ROLLBACK
        run: psql -X -v ON_ERROR_STOP=1 -f ci/phase4/b8-g2-cp03-private-upload-scope-regression.sql
      - name: REAL two-session PG17 concurrent Article-link vs old hard-delete transaction race
        run: bash ci/phase4/b8-g2-cp02-race-isolated-pg17.sh
  b8-g0-news-unchanged:
    name: G0 protected Phase3 News/Auth + B7 original closure unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Original protected Phase3 STATIC News/Auth/Security
        run: |
          node ci/phase3-regression/static-regression.cjs
          node ci/phase3-regression/static-security-architecture-regression.cjs
          node ci/phase3-regression/static-p3-security-regression.cjs
          node ci/phase3-regression/coverage-audit.cjs
      - name: B8 Private Evidence Gateway real byte/MIME/SHA256 mock-storage regression
        run: node --test ci/phase4/b8-g2-cp03-private-upload-gateway.test.mjs
      - name: B8 G3 CP01 role-scoped Android workflow and no-fake-SENT contract tests
        run: node --test ci/phase4/b8-g3-cp01-android-workflow.test.mjs
      - name: B7 canonical 9/60 never fake PASS or paid activation
        run: |
          node ci/phase4/b7-closure-gate.cjs --audit
          node --test ci/phase4/b7-closure-regression.cjs
          node ci/phase4/b7-public-secret-scan.cjs
      - name: Confirm no old News/B6/Ad application files modified by the G1 feature commit
        run: |
          set -euo pipefail
          test -f JANTA_BOL_PHASE_3C_WORKING/article.html
          test -f JANTA_BOL_PHASE_3C_WORKING/index.html
          test -f JANTA_BOL_PHASE_3C_WORKING/compliance.html
          echo 'B8 G0 protected source present; full E2/E3/E5 original regressions NOT implied by STATIC.'
