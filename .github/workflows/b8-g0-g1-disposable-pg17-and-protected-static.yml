  b8-master-source-backup:
    name: Full B0–B8 Source Master ZIP / all files / SHA256 / random test selector
    needs:
      - b8-g1-disposable-postgres
      - b8-g0-news-unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Scope and no-LIVE guard
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "codex/b8-g5-main-based-integration-20261017"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${B2_APPLICATION_KEY:-}"
          echo "Only zip/source manifest, NO Main merge, no Supabase/Storage/Edge/Vercel writes"
      - name: Python verified random original test selector
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/jb_manual_test.py ci/phase4/build_b0_b8_master_source_zip.py
          python3 tools/jb_manual_test.py --list > /tmp/jb-109-original-tests.txt
          test "$(grep -c '^P4-T[0-9][0-9][0-9] |' /tmp/jb-109-original-tests.txt)" -eq 109
          python3 tools/jb_manual_test.py T092 | grep 'ORIGINAL ACC CHECKPOINTS: ACC-001 to ACC-008'
          python3 tools/jb_manual_test.py P4-T034 | grep 'P4-T034'
          python3 tools/jb_manual_test.py 98 | grep 'ORIGINAL ACC CHECKPOINTS: ACC-036 to ACC-044'
      - name: Build EXACT tracked full B0–B8 source ZIP (not an empty/synthetic archive)
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/phase4/build_b0_b8_master_source_zip.py --out "dist/JANTA_BOL_B0_TO_B8_MASTER_SOURCE_${GITHUB_SHA:0:12}.zip"
          python3 ci/phase4/build_b0_b8_master_source_zip.py --verify "dist/JANTA_BOL_B0_TO_B8_MASTER_SOURCE_${GITHUB_SHA:0:12}.zip"
          test "$(stat -c %s dist/JANTA_BOL_B0_TO_B8_MASTER_SOURCE_*.zip)" -gt 200000
          echo "Full tracked Git commit pinned: $GITHUB_SHA"
          ls -lh dist/JANTA_BOL_B0_TO_B8_MASTER_SOURCE_*.zip dist/MASTER_ZIP_SHA256.txt
      - name: Upload user-saveable FULL master ZIP artifact for local backup
        uses: actions/upload-artifact@v4
        with:
          name: JANTA_BOL_B0_TO_B8_MASTER_SOURCE
          path: |
            dist/JANTA_BOL_B0_TO_B8_MASTER_SOURCE_*.zip
            dist/MASTER_ZIP_SHA256.txt
          if-no-files-found: error
          retention-days: 30
