        run: node --test ci/phase4/b8-g2-cp03-private-upload-gateway.test.mjs
      - name: B8 G3 CP01 browser-module syntax and no-fake-SENT role tests
        run: |
          node --check JANTA_BOL_PHASE_3C_WORKING/b8-accountability-client.mjs
          node --check JANTA_BOL_PHASE_3C_WORKING/b8-accountability-ui.mjs
          node --test ci/phase4/b8-g3-cp01-android-workflow.test.mjs
          node --test ci/phase4/b8-g3-cp02-cp03-android-contract.test.mjs
      - name: B8 G4 public-only client and Founder approval Android browser ESM / privacy contract
        run: |
          node --check JANTA_BOL_PHASE_3C_WORKING/b8-public-case-client.mjs
          node --check JANTA_BOL_PHASE_3C_WORKING/b8-public-case-ui.mjs
          node --test ci/phase4/b8-g4-public-projection-contract.test.mjs
          node --test ci/phase4/b8-g4-cp04-public-browser-lifecycle.test.mjs
      - name: B7 canonical 9/60 never fake PASS or paid activation
        run: |
          node ci/phase4/b7-closure-gate.cjs --audit
          node --test ci/phase4/b7-closure-regression.cjs
          node ci/phase4/b7-public-secret-scan.cjs
      - name: Confirm no old News/B6/Ad application files modified by the G1 feature commit
        run: |
          set -euo pipefail
          test -f JANTA_BOL_PHASE_3C_WORKING/article.html
          test -f JANTA_BOL_PHASE_3C_WORKING/index.html
          test -f JANTA_BOL_PHASE_3C_WORKING/compliance.html
          echo 'B8 G0 protected source present; full E2/E3/E5 original regressions NOT implied by STATIC.'
