name: T080 Admin Retry And Partial Failure Safety (Review Only)
on:
  push:
    branches:
      - codex/t080-admin-ack-failclosed-review-20261031
    paths:
      - 'JANTA_BOL_PHASE_3C_WORKING/add-news.html'
      - 'ci/phase4/b12/t080-admin-ack-failclosed.test.mjs'
      - '.github/workflows/b12-t080-admin-retry-review.yml'
  pull_request:
    branches:
      - codex/t080-geo-coverage-published-c1-20261031
permissions:
  contents: read
concurrency:
  group: jb-t080-admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  admin-retry:
    name: Offline Admin E2 Retry + No Loss Gate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Admin response and timeout synthetic tests
        run: |
          node --test ci/phase4/b12/t080-admin-ack-failclosed.test.mjs
          node --test ci/phase4/b12/founder-auth-readonly-regression.test.cjs
          node ci/phase4/p4-t019-publishing-fault-injection.cjs
          node --check JANTA_BOL_PHASE_3C_WORKING/backend-client.js
          node --check JANTA_BOL_PHASE_3C_WORKING/admin-auth.js
      - name: Preserve all production Publisher, Founder, LIVE and guest navigation baseline bytes
        run: |
          git diff --exit-code 14a929180d99088e950475eeee609cae8e3f01c8 HEAD -- \
            JANTA_BOL_PHASE_3C_WORKING/backend-client.js \
            JANTA_BOL_PHASE_3C_WORKING/admin-auth.js \
            JANTA_BOL_PHASE_3C_WORKING/admin-login.html \
            JANTA_BOL_PHASE_3C_WORKING/admin.html \
            JANTA_BOL_PHASE_3C_WORKING/article.html \
            JANTA_BOL_PHASE_3C_WORKING/public-c1-projection.js \
            JANTA_BOL_PHASE_3C_WORKING/website-v3.js \
            JANTA_BOL_PHASE_3C_WORKING/script.js \
            JANTA_BOL_PHASE_3C_WORKING/phase3c-live-engine-admin.js \
            vercel.json
