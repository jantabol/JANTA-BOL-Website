name: B11 T071 C2 six original PG17 permission/storage faults on exactly deployed C1 web source (NOT full E8)
on:
  push:
    branches: [codex/b11-t071-failure-isolation-preflight-20261027]
    paths:
      - '.github/workflows/b11-t071-c2-six-real-pg17-same-deployed-source.yml'
permissions:
  contents: read
jobs:
  original_pg17_six_component_faults_single_original_release_candidate:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && github.ref == 'refs/heads/codex/b11-t071-failure-isolation-preflight-20261027' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: C2_SIX_PG17_DISPOSABLE_ONLY
          POSTGRES_USER: postgres
          POSTGRES_DB: jb_c2_root
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jb_c2_root"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 25
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: C2_SIX_PG17_DISPOSABLE_ONLY
      PGDATABASE: jb_c2_root
    steps:
      - name: Review C2 fault scripts only, no persisted tokens
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Actual exact same deployed C1 preview web and original B7/B8 SQL source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 89849ba47f443f423d8bfe4f966bb2d38087201f
          path: t071-c2-full-actual
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed on wrong candidate or external paid/prod credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'jantabol/JANTA-BOL-Website'
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = jb_c2_root
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num' | cut -c1-2)" = 17
          test "$(git -C t071-c2-full-actual rev-parse HEAD)" = 89849ba47f443f423d8bfe4f966bb2d38087201f
          git -C t071-c2-full-actual diff --exit-code 659bcdc2ec4e270ea066863b4b456aeb65cb7c73 HEAD -- JANTA_BOL_PHASE_3C_WORKING
          for sql in ci/phase4/b7-payment-fixture.sql ci/phase4/b8-g1-disposable-fixture.sql JANTA_BOL_PHASE_4_WORKING/db/20261010_b7_manual_payment_REVIEW_ONLY.sql JANTA_BOL_PHASE_4_WORKING/db/20261012_b7_lifecycle_state_guard_REVIEW_ONLY.sql JANTA_BOL_PHASE_4_WORKING/db/20261010_b7_qualified_impressions_REVIEW_ONLY.sql JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_case_reporter_scope_REVIEW_ONLY.sql; do
            git -C t071-c2-full-actual diff --exit-code 658f474d6ee0f24efac60f069979e8adee1e9221 HEAD -- "$sql"
          done
          echo 'C2_SIX_AUTHENTIC_B7_B8_SQL_BLOBS_IDENTICAL_TO_OLD_REAL_PG17_RUN=PASS'
          echo 'C2_EXACT_REAL_C1_PREVIEW_CODE_PIN=PASS'
      - name: Create only isolated temporary PostgreSQL 17 databases for six actual faults
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in jb_c2_ads jb_c2_analytics jb_c2_notify jb_c2_account jb_c2_db; do
            createdb "$name"
            test "$(psql -X -qAt -d "$name" -c 'SELECT current_database()')" = "$name"
          done
          echo 'C2_ALL_FIVE_EPHEMERAL_PG17_ISOLATED_NAMESPACES=PASS'
      - name: Original B7 real payment storage fault and Ads NO FALSE LIVE #06 #11
        shell: bash
        run: |
          set -Eeuo pipefail
          export PGDATABASE=jb_c2_ads
          d=t071-c2-full-actual
          psql -X -q -v ON_ERROR_STOP=1 -f "$d/ci/phase4/b7-payment-fixture.sql"
          psql -X -q -v ON_ERROR_STOP=1 -f "$d/JANTA_BOL_PHASE_4_WORKING/db/20261010_b7_manual_payment_REVIEW_ONLY.sql"
          psql -X -q -v ON_ERROR_STOP=1 -f "$d/JANTA_BOL_PHASE_4_WORKING/db/20261012_b7_lifecycle_state_guard_REVIEW_ONLY.sql"
          psql -X -q -v ON_ERROR_STOP=1 -f ci/phase4/b11/t071-c2-b7-real-pg17-payment-ads-fault.sql
          echo 'C2_06_ADVERTISING_11_PAYMENTS_REAL_PG17_DENY_NO_PAID_AD_LIVE=PASS'
      - name: Original B7 real analytics RPC permission fault and restoration #02
        shell: bash
        run: |
          set -Eeuo pipefail
          export PGDATABASE=jb_c2_analytics
          d=t071-c2-full-actual
          psql -X -q -v ON_ERROR_STOP=1 -f "$d/ci/phase4/b7-payment-fixture.sql"
          psql -X -q -v ON_ERROR_STOP=1 -c "CREATE TABLE public.articles(id uuid primary key, status text NOT NULL); INSERT INTO public.articles(id,status) VALUES('10000000-0000-0000-0000-000000000001','published');"
          psql -X -q -v ON_ERROR_STOP=1 -f "$d/ci/phase4/b7-view-ticket-fixture.sql"
          psql -X -q -v ON_ERROR_STOP=1 -f "$d/JANTA_BOL_PHASE_4_WORKING/db/20261010_b7_qualified_impressions_REVIEW_ONLY.sql"
          psql -X -q -v ON_ERROR_STOP=1 -f ci/phase4/b11/t071-c2-analytics-real-pg17.sql
          echo 'C2_02_ANALYTICS_REAL_PG17_RPC_PERMISSION_FAULT_RESTORED=PASS'
      - name: Original B8 real notification storage fault and original business commit #03
        shell: bash
        run: |
          set -Eeuo pipefail
          export PGDATABASE=jb_c2_notify
          d=t071-c2-full-actual
          n=0
          apply() { psql -X -q -v ON_ERROR_STOP=1 -f "$d/$1" >/dev/null; n=$((n+1)); }
          apply ci/phase4/b8-g1-disposable-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_case_reporter_scope_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_owner_mobile_case_picker_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_cp02_editor_immutable_review_REVIEW_ONLY.sql
          apply ci/phase4/b8-g2-cp01-cascade-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp01_provenance_survival_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp02_article_hold_GUARD_REVIEW_ONLY.sql
          apply ci/phase4/b8-g2-cp03-upload-session-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp03_private_upload_REVIEW_ONLY.sql
          apply ci/phase4/b8-g3-cp02-notification-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g3_cp02_founder_proof_notifications_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g3_cp03_manual_handoff_truth_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g3_cp04_reply_claim_REVIEW_ONLY.sql
          apply ci/phase4/b8-g4-public-article-status-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g4_cp01_cp03_public_projection_REVIEW_ONLY.sql
          test "$n" -eq 15
          psql -X -q -v ON_ERROR_STOP=1 -f ci/phase4/b11/t071-c2-notification-storage-real-pg17.sql
          echo 'C2_03_NOTIFICATIONS_REAL_PG17_STORAGE_FAULT_ORIGINAL_B8_CASE_SURVIVES=PASS'
      - name: Original B8 real optional Accountability RPC fault and peer continuity #08
        shell: bash
        run: |
          set -Eeuo pipefail
          export PGDATABASE=jb_c2_account
          d=t071-c2-full-actual
          n=0
          apply() { psql -X -q -v ON_ERROR_STOP=1 -f "$d/$1" >/dev/null; n=$((n+1)); }
          apply ci/phase4/b8-g1-disposable-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_case_reporter_scope_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_owner_mobile_case_picker_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_cp02_editor_immutable_review_REVIEW_ONLY.sql
          apply ci/phase4/b8-g2-cp01-cascade-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp01_provenance_survival_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp02_article_hold_GUARD_REVIEW_ONLY.sql
          apply ci/phase4/b8-g2-cp03-upload-session-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g2_cp03_private_upload_REVIEW_ONLY.sql
          apply ci/phase4/b8-g3-cp02-notification-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g3_cp02_founder_proof_notifications_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g3_cp03_manual_handoff_truth_REVIEW_ONLY.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g3_cp04_reply_claim_REVIEW_ONLY.sql
          apply ci/phase4/b8-g4-public-article-status-fixture.sql
          apply JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g4_cp01_cp03_public_projection_REVIEW_ONLY.sql
          test "$n" -eq 15
          psql -X -q -v ON_ERROR_STOP=1 -f ci/phase4/b11/t071-e8-b8-real-db-module-isolation.sql
          echo 'C2_08_ACCOUNTABILITY_REAL_PG17_PUBLIC_RPC_FAULT_OTHER_CASE_PEER_CONTINUES=PASS'
      - name: Original B8 real DB failed transaction with no false ack and recovery #13
        shell: bash
        run: |
          set -Eeuo pipefail
          export PGDATABASE=jb_c2_db
          d=t071-c2-full-actual
          psql -X -q -v ON_ERROR_STOP=1 -f "$d/ci/phase4/b8-g1-disposable-fixture.sql"
          psql -X -q -v ON_ERROR_STOP=1 -f "$d/JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_case_reporter_scope_REVIEW_ONLY.sql"
          psql -X -q -v ON_ERROR_STOP=1 -f ci/phase4/b11/t071-c2-db-no-false-commit-real-pg17.sql
          echo 'C2_13_DATABASE_REAL_PG17_FAILED_WRITE_FALSE_ACK_DENIED_RECOVERED=PASS'
      - name: Confirm no hosted/provider failures claimed and no production mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'C2_PG17_FAMILIES_REAL_CANDIDATE_SOURCE=6_OF_6_PASS_SCOPED'
          echo 'C2_LOCAL_HTTP_FAMILIES_SAME_CANDIDATE=7_OF_7_SEPARATE_RUN'
          echo 'C2_REAL_EXTERNAL_PROVIDER_LARIX_OR_LIVE_DATABASE_OUTAGE=NOT_TESTED'
          echo 'C2_FULL_CONNECTED_ORIGINAL_E2=HOLD'
          echo 'C2_FINAL_PASS_LOCK=false'
          echo 'T071_FINAL_PASS_LOCK=false'
