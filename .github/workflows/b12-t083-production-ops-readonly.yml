# P4-T083 public operations only: no secrets/production writes, no cutover.
name: T083 real domain DNS TLS HTTPS + release HOLD (review only)
on:
  push:
    branches: [codex/t083-live-operations-preflight-20261031]
    paths:
      - '.github/workflows/b12-t083-production-ops-readonly.yml'
      - 'ci/phase4/b12/t083-production-ops-real-http.test.mjs'
      - 'ci/phase4/b12/t083-build-evidence-pack.py'
      - 'ci/phase4/b12/t083-build-live-public-site-snapshot.py'
      - 'ci/phase4/b12/t083-b12-final-evidence-gate.test.mjs'
      - 'ci/phase4/b12/t080-pr84-preview-http-source-parity.test.mjs'
      - 'JANTA_BOL_PHASE_4_WORKING/b12/P4_B12_T076_T083_FINAL_EVIDENCE_LEDGER_20261031.json'
      - 'JANTA_BOL_PHASE_4_WORKING/b12/P4_T083_PRODUCTION_OPS_READONLY_20261031.md'
  pull_request:
    branches: [codex/t080-admin-ack-failclosed-review-20261031]
permissions:
  contents: read
concurrency:
  group: janta-bol-t083-ops-no-write-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-ops-readonly:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact scoped review-only diff, no private config or secret injection
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='93df12aa8ffdfae38d9a4066b6a4556bb36969e5'
          git cat-file -e "$BASE^{commit}"
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/b12-t083-production-ops-readonly.yml|ci/phase4/b12/t083-production-ops-real-http.test.mjs|ci/phase4/b12/t083-build-evidence-pack.py|ci/phase4/b12/t083-build-live-public-site-snapshot.py|ci/phase4/b12/t083-b12-final-evidence-gate.test.mjs|ci/phase4/b12/t080-pr84-preview-http-source-parity.test.mjs|JANTA_BOL_PHASE_4_WORKING/b12/P4_B12_T076_T083_FINAL_EVIDENCE_LEDGER_20261031.json|JANTA_BOL_PHASE_4_WORKING/b12/P4_T083_PRODUCTION_OPS_READONLY_20261031.md) ;;
              *) echo "T083_UNAUTHORIZED_CHANGE=$file"; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          echo 'T083_PRODUCT_FOUNDER_BACKUP_BYTES_UNCHANGED=PASS'
      - name: Real external DNS, trusted cert and canonical public HTTPS checks
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check ci/phase4/b12/t083-production-ops-real-http.test.mjs
          node --test ci/phase4/b12/t083-production-ops-real-http.test.mjs
      - name: Safe selected original Founder and publishing regression on actual LIVE source
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test ci/phase4/b12/t080-admin-ack-failclosed.test.mjs
          node --test ci/phase4/b12/founder-auth-readonly-regression.test.cjs
          node ci/phase4/p4-t019-publishing-fault-injection.cjs
          node --check JANTA_BOL_PHASE_3C_WORKING/backend-client.js
          node --check JANTA_BOL_PHASE_3C_WORKING/admin-auth.js
          echo 'T083_LIVE_SOURCE_SELECTED_FOUNDER_PUBLISHER_REGRESSION=PASS_SCOPED'
      - name: Actual anonymous Incognito Chrome E5 on published domain (existing QA DRAFT only)
        shell: bash
        run: |
          set -Eeuo pipefail
          # Reuse exact source from PR91; never copy unknown private data or login tokens.
          SOURCE='97065707d367c5f960a506300b5f384106ab68a8'
          git cat-file -e "$SOURCE^{commit}"
          git show "$SOURCE:ci/phase4/b12/t082-anon-live-chrome.test.mjs" > "$RUNNER_TEMP/t082-anon-live-chrome.test.mjs"
          node --check "$RUNNER_TEMP/t082-anon-live-chrome.test.mjs"
          node --test "$RUNNER_TEMP/t082-anon-live-chrome.test.mjs"
          echo 'T082_PUBLIC_ANON_CHROME_TWO_ROUTES=PASS_SCOPED'
          echo 'T082_CURRENT_FOUNDER_LIFECYCLE_E4=NOT_RUN'
      - name: Real PR84 Vercel preview source integrity vs code review SHA (no login/write)
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test ci/phase4/b12/t080-pr84-preview-http-source-parity.test.mjs
      - name: Reconcile all eight T076–T083 tests + hard E8/E4/Owner release HOLD
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check ci/phase4/b12/t083-b12-final-evidence-gate.test.mjs
          node --test ci/phase4/b12/t083-b12-final-evidence-gate.test.mjs
          echo 'B12_EIGHT_TESTS_RECONCILED=PASS_SCOPED'
          echo 'B12_FINAL_LOCK=HOLD'
      - name: Generate deterministic scanned evidence-only ZIP (NOT source/archive/backup)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ci/phase4/b12/t083-build-evidence-pack.py
          sha256sum out/T083_PUBLIC_OPS_EVIDENCE_ONLY_20261031.zip
      - name: Upload scoped operations evidence ZIP (NOT real backup or signed release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: T083_PUBLIC_OPS_EVIDENCE_ONLY_20261031
          path: out/T083_PUBLIC_OPS_EVIDENCE_ONLY_20261031.zip
          if-no-files-found: error
          retention-days: 5
      - name: Generate exact live-SHA public website source snapshot (NOT full B12 backup)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ci/phase4/b12/t083-build-live-public-site-snapshot.py
          sha256sum out/T083_LIVE_PUBLIC_SITE_SOURCE_CANDIDATE_20261031.zip
      - name: Upload scoped public website source candidate ZIP (NOT full B12 signed release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: T083_LIVE_PUBLIC_SITE_SOURCE_CANDIDATE_20261031
          path: out/T083_LIVE_PUBLIC_SITE_SOURCE_CANDIDATE_20261031.zip
          if-no-files-found: error
          retention-days: 5
      - name: Required final GO/NO-GO gate never silently waived
        run: |
          echo 'T083_READONLY_EXTERNAL_HTTP_TLS=SCOPED_TESTS_ONLY'
          echo 'T083_REGISTRAR_OWNERSHIP_RENEWAL=NOT_VERIFIED'
          echo 'T083_MAINTENANCE_DNS_CHANGE_RECORD=PARTIAL'
          echo 'T083_TOPIC11_ALL_REGRESSION=NOT_PROVEN'
          echo 'T083_CURRENT_PRODUCTION_E8_FULL_RESTORE_AND_ROLLBACK=NOT_RUN'
          echo 'T083_FINAL_PASS_LOCK=HOLD'
