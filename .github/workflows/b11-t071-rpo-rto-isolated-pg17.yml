name: B11 T071 REAL isolated PG17 RPO-RTO measurement (NOT PRODUCTION)
on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/phase4/b11/t071-rpo-rto-isolated-pg17-drill.py'
      - '.github/workflows/b11-t071-rpo-rto-isolated-pg17.yml'
permissions:
  contents: read
jobs:
  rpo_rto_disposable_pg17_no_live:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'jantabol/JANTA-BOL-Website' && github.head_ref == 'codex/b11-t071-failure-isolation-preflight-20261027' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      T071_ISOLATED_ONLY: YES
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm no live credentials or mutation authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "jantabol/JANTA-BOL-Website"
          test "$GITHUB_HEAD_REF" = "codex/b11-t071-failure-isolation-preflight-20261027"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          test -z "${DATABASE_URL:-}"
          python3 -m py_compile ci/phase4/b11/t071-rpo-rto-isolated-pg17-drill.py
      - name: Actual disposable PostgreSQL 17 crash, restore, independent read, and RPO-RTO timestamps
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 -u ci/phase4/b11/t071-rpo-rto-isolated-pg17-drill.py
          echo "T071_REAL_JANTA_BOL_PRODUCTION_INCIDENT=false"
          echo "T071_REAL_HOSTED_FULL_STACK_RPO_RTO=NOT_ESTABLISHED"
          echo "T071_FINAL_E8=HOLD"
