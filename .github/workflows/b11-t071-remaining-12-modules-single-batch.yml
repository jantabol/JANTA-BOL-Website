name: B11 T071 Remaining 12 SOURCE failure modules — single batch (NOT full E8)
on:
  push:
    branches: [codex/b11-t071-failure-isolation-preflight-20261027]
    paths:
      - '.github/workflows/b11-t071-remaining-12-modules-single-batch.yml'
      - 'JANTA_BOL_PHASE_4_WORKING/review/P4_T071_TWELVE_MODULES_REALITY_REPORT_20261027.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/b11-t071-remaining-12-modules-single-batch.yml'
      - 'JANTA_BOL_PHASE_4_WORKING/review/P4_T071_TWELVE_MODULES_REALITY_REPORT_20261027.md'
permissions:
  contents: read
jobs:
  source_twelve_failures_and_core_publishing:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && ((github.event_name == 'push' && github.ref == 'refs/heads/codex/b11-t071-failure-isolation-preflight-20261027') || (github.event_name == 'pull_request' && github.head_ref == 'codex/b11-t071-failure-isolation-preflight-20261027')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout T071 source branch without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact pinned JANTA BOL B8 backend/frontend source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 658f474d6ee0f24efac60f069979e8adee1e9221
          path: t071-integrated-fixture
          persist-credentials: false
      - name: Exact pinned B9 search/news/branding source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b509c60fceb053a51686f67e587d4922a40fa6f4
          path: t071-search-fixture
          persist-credentials: false
      - name: Fail closed on source identity, external network targets and secrets
        shell: bash
        env:
          T071_PINNED_INTEGRATED_ROOT: t071-integrated-fixture
          T071_PINNED_SEARCH_ROOT: t071-search-fixture
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'jantabol/JANTA-BOL-Website'
          test "$(git -C "$T071_PINNED_INTEGRATED_ROOT" rev-parse HEAD)" = 658f474d6ee0f24efac60f069979e8adee1e9221
          test "$(git -C "$T071_PINNED_SEARCH_ROOT" rev-parse HEAD)" = b509c60fceb053a51686f67e587d4922a40fa6f4
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          node --check ci/phase4/b11/t071-thirteen-actual-adapters-isolated-faults.test.mjs
      - name: Run EXACT 12 remaining source adapters with expected RPC/provider failure
        shell: bash
        env:
          T071_PINNED_INTEGRATED_ROOT: t071-integrated-fixture
          T071_PINNED_SEARCH_ROOT: t071-search-fixture
        run: |
          set -Eeuo pipefail
          node --test --test-name-pattern='^(0[1-7]|09|1[0-3])\\b' ci/phase4/b11/t071-thirteen-actual-adapters-isolated-faults.test.mjs
          echo 'T071_REMAINING_12_REAL_SOURCE_ADAPTERS_WITH_FAKE_DEPENDENCY_FAULTS=12_SELECTED'
          echo 'T071_REMAINING_12_CONNECTED_SERVER_FAULTS=NOT_RUN'
      - name: Core News publish amid compliance failure, Owner AAL2 & version safety using actual source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd t071-integrated-fixture
          node ci/phase4/p4-t019-publishing-fault-injection.cjs
          echo 'T071_CORE_NEWS_PUBLISH_WITH_COMPLIANCE_MOCK_FAILURE=PASS_SOURCE_SIMULATION'
      - name: Preserve original Ads/Article public renderer and B8 public privacy regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd t071-integrated-fixture
          node --test ci/phase4/b7-t040-cp02-analytics-failure-isolation.test.cjs ci/phase4/b8-g4-cp04-public-browser-lifecycle.test.mjs
          echo 'T071_CORE_PUBLIC_NEWS_ADS_B8_REGRESSION=PASS_SELECTED'
      - name: Final no-fake-pass scope guard
        run: |
          echo 'T071_CUSTOM_DOMAIN_jantaboli.in=FOUNDER_DUE'
          echo 'T071_ALL_REMAINING_12_FULL_REAL_BACKEND_E8=HOLD'
          echo 'T071_FINAL_PASS_LOCK=false'
          echo 'T071_PRODUCTION_WRITES=0'
