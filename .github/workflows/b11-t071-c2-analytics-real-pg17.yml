name: B11 T071 C2 real B7 analytics SQL permission fault and recovery
on:
  push:
    branches: [codex/b11-t071-failure-isolation-preflight-20261027]
    paths:
      - 'ci/phase4/b11/t071-c2-analytics-real-pg17.sql'
      - '.github/workflows/b11-t071-c2-analytics-real-pg17.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ci/phase4/b11/t071-c2-analytics-real-pg17.sql'
      - '.github/workflows/b11-t071-c2-analytics-real-pg17.yml'
permissions:
  contents: read
jobs:
  analytics_rpc_pg17_real_permission_failure:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && ((github.event_name == 'push' && github.ref == 'refs/heads/codex/b11-t071-failure-isolation-preflight-20261027') || (github.event_name == 'pull_request' && github.head_ref == 'codex/b11-t071-failure-isolation-preflight-20261027')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: T071_C2_ANALYTICS_DISPOSABLE_ONLY
          POSTGRES_USER: postgres
          POSTGRES_DB: jb_t071_c2_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jb_t071_c2_analytics"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 25
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: T071_C2_ANALYTICS_DISPOSABLE_ONLY
      PGDATABASE: jb_t071_c2_analytics
    steps:
      - name: Checkout exact C2 branch read only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout authentic original B7 SQL source (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 658f474d6ee0f24efac60f069979e8adee1e9221
          path: t071-c2-real-b7-analytics
          persist-credentials: false
      - name: Verify PG17 ephemeral target and no production secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'jantabol/JANTA-BOL-Website'
          test "$(git -C t071-c2-real-b7-analytics rev-parse HEAD)" = '658f474d6ee0f24efac60f069979e8adee1e9221'
          test "$PGDATABASE" = jb_t071_c2_analytics
          test "$PGHOST" = 127.0.0.1
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num' | cut -c1-2)" = 17
          echo 'T071_C2_ANALYTICS_REAL_PG17_ISOLATED=PASS'
      - name: Materialize original real B7 campaign/event and reviewed analytics RPC SQL
        shell: bash
        run: |
          set -Eeuo pipefail
          root=t071-c2-real-b7-analytics
          psql -X -q -v ON_ERROR_STOP=1 -f "$root/ci/phase4/b7-payment-fixture.sql"
          psql -X -q -v ON_ERROR_STOP=1 -c "CREATE TABLE public.articles(id uuid primary key, status text NOT NULL); INSERT INTO public.articles(id,status) VALUES('10000000-0000-0000-0000-000000000001','published');"
          psql -X -q -v ON_ERROR_STOP=1 -f "$root/ci/phase4/b7-view-ticket-fixture.sql"
          psql -X -q -v ON_ERROR_STOP=1 -f "$root/JANTA_BOL_PHASE_4_WORKING/db/20261010_b7_qualified_impressions_REVIEW_ONLY.sql"
          echo 'T071_C2_REAL_B7_QUALIFIED_ANALYTICS_FUNCTION_LOADED_DISPOSABLE=PASS'
      - name: Actual PostgreSQL revoke, deny read, preserve old state, restore and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -f ci/phase4/b11/t071-c2-analytics-real-pg17.sql
          echo 'T071_C2_REAL_ANALYTICS_FAULT=PASS_SCOPED'
          echo 'T071_C2_REAL_HOSTED_ANALYTICS=NOT_TESTED'
          echo 'T071_FINAL_PASS_LOCK=false'
