name: B11 T071 C2 real DB write failure no false commit — PG17
on:
  push:
    branches: [codex/b11-t071-failure-isolation-preflight-20261027]
    paths:
      - 'ci/phase4/b11/t071-c2-db-no-false-commit-real-pg17.sql'
      - '.github/workflows/b11-t071-c2-database-false-ack-pg17.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ci/phase4/b11/t071-c2-db-no-false-commit-real-pg17.sql'
      - '.github/workflows/b11-t071-c2-database-false-ack-pg17.yml'
permissions:
  contents: read
jobs:
  original_b8_rpc_db_failed_write_not_false_success:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && ((github.event_name == 'push' && github.ref == 'refs/heads/codex/b11-t071-failure-isolation-preflight-20261027') || (github.event_name == 'pull_request' && github.head_ref == 'codex/b11-t071-failure-isolation-preflight-20261027')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: T071_C2_DB_DISPOSABLE_ONLY
          POSTGRES_USER: postgres
          POSTGRES_DB: jb_t071_c2_commit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jb_t071_c2_commit"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 25
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: T071_C2_DB_DISPOSABLE_ONLY
      PGDATABASE: jb_t071_c2_commit
    steps:
      - name: Checkout C2 test branch without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout unchanged real B8 source fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 658f474d6ee0f24efac60f069979e8adee1e9221
          path: t071-c2-b8-db-source
          persist-credentials: false
      - name: Check exact repo/source and deny production credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'jantabol/JANTA-BOL-Website'
          test "$(git -C t071-c2-b8-db-source rev-parse HEAD)" = '658f474d6ee0f24efac60f069979e8adee1e9221'
          test "$PGDATABASE" = 'jb_t071_c2_commit'
          test "$PGHOST" = '127.0.0.1'
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num' | cut -c1-2)" = 17
          echo 'C2_EXACT_REAL_DISPOSABLE_PG17_DB_CHECK=PASS'
      - name: Load source-authentic G1 fixture and original Owner/AAL2 RPC
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -f t071-c2-b8-db-source/ci/phase4/b8-g1-disposable-fixture.sql
          psql -X -q -v ON_ERROR_STOP=1 -f t071-c2-b8-db-source/JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_case_reporter_scope_REVIEW_ONLY.sql
          echo 'C2_ORIGINAL_B8_G1_REAL_DB_FUNCTION_APPLIED_DISPOSABLE=PASS'
      - name: Force real database rejection, verify B8 RPC no false acknowledged commit, recover
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -f ci/phase4/b11/t071-c2-db-no-false-commit-real-pg17.sql
          echo 'C2_ORIGINAL_B8_RPC_DATABASE_FAIL_CLOSED=PASS_COMPONENT'
          echo 'C2_DATABASE_FULL_CONNECTED_E8=NOT_PROVEN'
          echo 'T071_FINAL_PASS_LOCK=false'
