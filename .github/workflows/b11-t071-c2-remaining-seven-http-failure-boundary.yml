name: B11 T071 C2 seven original clients real localhost 503 (not hosted E8)
on:
  push:
    branches: [codex/b11-t071-failure-isolation-preflight-20261027]
    paths:
      - 'ci/phase4/b11/t071-c2-seven-remaining-real-http-faults.test.mjs'
      - '.github/workflows/b11-t071-c2-remaining-seven-http-failure-boundary.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ci/phase4/b11/t071-c2-seven-remaining-real-http-faults.test.mjs'
      - '.github/workflows/b11-t071-c2-remaining-seven-http-failure-boundary.yml'
permissions:
  contents: read
jobs:
  seven_boundaries_real_local_http_no_live_credentials:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && ((github.event_name == 'push' && github.ref == 'refs/heads/codex/b11-t071-failure-isolation-preflight-20261027') || (github.event_name == 'pull_request' && github.head_ref == 'codex/b11-t071-failure-isolation-preflight-20261027')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test harness only, no saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin actual B8 Grievance Compliance LIVE Social Provider source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 658f474d6ee0f24efac60f069979e8adee1e9221
          path: t071-c2-pinned-b8
          persist-credentials: false
      - name: Pin exact full existing news Article B9 candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b509c60fceb053a51686f67e587d4922a40fa6f4
          path: t071-c2-pinned-news
          persist-credentials: false
      - name: Safety, identity and no external provider access
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = jantabol/JANTA-BOL-Website
          test "$(git -C t071-c2-pinned-b8 rev-parse HEAD)" = 658f474d6ee0f24efac60f069979e8adee1e9221
          test "$(git -C t071-c2-pinned-news rev-parse HEAD)" = b509c60fceb053a51686f67e587d4922a40fa6f4
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          node --check ci/phase4/b11/t071-c2-seven-remaining-real-http-faults.test.mjs
          echo 'C2_SEVEN_REAL_SOURCE_PIN_AND_NO_PROVIDER_CREDENTIALS=PASS'
      - name: Execute real HTTP request/response negative tests against seven original adapters
        shell: bash
        env:
          T071_C2_B8_SOURCE: ${{ github.workspace }}/t071-c2-pinned-b8
          T071_C2_NEWS_SOURCE: ${{ github.workspace }}/t071-c2-pinned-news
        run: |
          set -Eeuo pipefail
          node --test ci/phase4/b11/t071-c2-seven-remaining-real-http-faults.test.mjs
          echo 'C2_SEVEN_ORIGINAL_ADAPTERS_ACTUAL_LOCAL_HTTP_503=PASS_SCOPED'
          echo 'C2_SAME_RELEASE_BACKEND_AND_REAL_PROVIDER_E8=NOT_RUN'
          echo 'C2_FULL_13_FAMILY_HOSTED_PROOF=HOLD'
          echo 'T071_FINAL_PASS_LOCK=false'
