name: B11 T071 C2 seven original clients real localhost 503 (not hosted E8)
on:
  push:
    branches: [codex/b11-t071-failure-isolation-preflight-20261027]
    paths:
      - 'ci/phase4/b11/t071-c2-seven-remaining-real-http-faults.test.mjs'
      - '.github/workflows/b11-t071-c2-remaining-seven-http-failure-boundary.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ci/phase4/b11/t071-c2-seven-remaining-real-http-faults.test.mjs'
      - '.github/workflows/b11-t071-c2-remaining-seven-http-failure-boundary.yml'
permissions:
  contents: read
jobs:
  seven_boundaries_real_local_http_no_live_credentials:
    if: ${{ github.repository == 'jantabol/JANTA-BOL-Website' && ((github.event_name == 'push' && github.ref == 'refs/heads/codex/b11-t071-failure-isolation-preflight-20261027') || (github.event_name == 'pull_request' && github.head_ref == 'codex/b11-t071-failure-isolation-preflight-20261027')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: T071_C2_SEVEN_DISPOSABLE_ONLY
          POSTGRES_USER: postgres
          POSTGRES_DB: jb_t071_c2_seven
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jb_t071_c2_seven"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 25
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: T071_C2_SEVEN_DISPOSABLE_ONLY
      PGDATABASE: jb_t071_c2_seven
    steps:
      - name: Test harness only, no saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin actual B8 Grievance Compliance LIVE Social Provider source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 658f474d6ee0f24efac60f069979e8adee1e9221
          path: t071-c2-pinned-b8
          persist-credentials: false
      - name: Pin exact full existing news Article B9 candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b509c60fceb053a51686f67e587d4922a40fa6f4
          path: t071-c2-pinned-news
          persist-credentials: false
      - name: Safety, identity and no external provider access
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = jantabol/JANTA-BOL-Website
          test "$(git -C t071-c2-pinned-b8 rev-parse HEAD)" = 658f474d6ee0f24efac60f069979e8adee1e9221
          test "$(git -C t071-c2-pinned-news rev-parse HEAD)" = b509c60fceb053a51686f67e587d4922a40fa6f4
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${JB_B11_SERVICE_ROLE_KEY:-}"
          test -z "${JB_BACKUP_B2_APPLICATION_KEY:-}"
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = jb_t071_c2_seven
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'show server_version_num' | cut -c 1-2)" = 17
          node --check ci/phase4/b11/t071-c2-seven-remaining-real-http-faults.test.mjs
          echo 'C2_SEVEN_REAL_SOURCE_PIN_AND_NO_PROVIDER_CREDENTIALS=PASS'
      - name: Commit an actual source-backed Founder B8 business case before external messaging failure
        shell: bash
        run: |
          set -Eeuo pipefail
          d=t071-c2-pinned-b8
          psql -X -q -v ON_ERROR_STOP=1 -f "$d/ci/phase4/b8-g1-disposable-fixture.sql"
          psql -X -q -v ON_ERROR_STOP=1 -f "$d/JANTA_BOL_PHASE_4_WORKING/db/20261017_b8_g1_case_reporter_scope_REVIEW_ONLY.sql"
          psql -X -q -v ON_ERROR_STOP=1 -c "
            SELECT set_config('b8.fixture_actor','11111111-1111-1111-1111-111111111111',false);
            SELECT set_config('b8.fixture_session','on',false);
            SELECT set_config('b8.fixture_aal','aal2',false);
            SET ROLE authenticated;
            SELECT public.jb_b8_g1_owner_create_case(
              'C2 genuine committed business action survives failed messaging',
              'Pichhore','R1'
            );
          " >/dev/null
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.b8_cases WHERE title='C2 genuine committed business action survives failed messaging'")" = 1
          echo 'C2_ORIGINAL_B8_CASE_ACTUALLY_COMMITTED_BEFORE_MESSAGING_FAULT=PASS'
      - name: Execute real HTTP request/response negative tests against seven original adapters
        shell: bash
        env:
          T071_C2_B8_SOURCE: ${{ github.workspace }}/t071-c2-pinned-b8
          T071_C2_NEWS_SOURCE: ${{ github.workspace }}/t071-c2-pinned-news
        run: |
          set -Eeuo pipefail
          node --test ci/phase4/b11/t071-c2-seven-remaining-real-http-faults.test.mjs
          # Same isolated database, post-fault independent readback:
          # no messaging/provider failure may retroactively undo committed B8 action.
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.b8_cases WHERE title='C2 genuine committed business action survives failed messaging'")" = 1
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.articles WHERE headline='Existing News Article' AND status='published'")" = 1
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.ad_campaigns WHERE status='requested'")" = 1
          echo 'C2_ORIGINAL_B8_COMMITTED_CASE_NEWS_AD_STILL_STABLE_AFTER_REAL_HTTP_MESSAGE_FAULT=PASS'
          echo 'C2_SEVEN_ORIGINAL_ADAPTERS_ACTUAL_LOCAL_HTTP_503=PASS_SCOPED'
          echo 'C2_SAME_RELEASE_BACKEND_AND_REAL_PROVIDER_E8=NOT_RUN'
          echo 'C2_FULL_13_FAMILY_HOSTED_PROOF=HOLD'
          echo 'T071_FINAL_PASS_LOCK=false'
