# JANTA BOL T034 / G3 — manual PASSWORD AUTH CHECK only.
# Hard safety: No pg_dump, no backup, no B2 write, no application table read.
name: JANTA BOL T034 DB password verification (manual READ ONLY)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type JANTA_BOL_DB_READ_ONLY to verify database password without exporting data
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: janta-bol-t034-db-password-readonly
  cancel-in-progress: false
jobs:
  verify-db-secret:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'jantabol/JANTA-BOL-Website' && github.ref == 'refs/heads/main' && github.event.inputs.confirmation == 'JANTA_BOL_DB_READ_ONLY' }}
    runs-on: ubuntu-latest
    environment: janta-bol-production-backup
    timeout-minutes: 8
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGHOST: aws-0-ap-south-1.pooler.supabase.com
      PGPORT: '5432'
      PGUSER: postgres.vrffsnkycvjithwtiylt
      PGDATABASE: postgres
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: '12'
      PGOPTIONS: '-c default_transaction_read_only=on'
    steps:
      - name: Check nonempty GitHub Environment secret (value NEVER printed)
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if [[ -z "${PGPASSWORD:-}" ]]; then
            echo '::error::SUPABASE_DB_PASSWORD is absent from the JANTA BOL production-backup environment.'
            exit 1
          fi
          echo 'PASS: a database-password secret is configured; actual authentication still pending.'
      - name: Install PostgreSQL client only (no application checkout)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Authenticate only against JANTA BOL pooler with a constant read-only SELECT
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          # Never echo the password, any connection URL, SQL output, or database records.
          # pg_isready alone is NOT a password test; psql SELECT 1 IS.
          if ! result="$(psql -X -q -A -t -v ON_ERROR_STOP=1 -c 'BEGIN TRANSACTION READ ONLY; SELECT 1; COMMIT;' 2>/dev/null)"; then
            echo '::error::DB_PASSWORD_AUTH=FAIL. JANTA BOL session-pooler login did not succeed. No database changes attempted.'
            exit 1
          fi
          if [[ "$result" != '1' ]]; then
            echo '::error::Unexpected read-only constant response. Treat as FAIL; no application data accessed.'
            exit 1
          fi
          echo 'PASS: DB_PASSWORD_AUTH=VERIFIED for exact JANTA BOL project using a read-only SELECT 1.'
          echo 'NO BACKUP, NO B2 UPLOAD, NO PRIVATE DATA READ, NO DATABASE WRITES, NO KEY/SECRET LOGGED.'
